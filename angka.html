<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Statistik Kanwil Kemenag Banten</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="siteNavbar"></div>

  <div id="innerHero"></div>

  <main class="page-container">

  <section class="content-section">

    <div class="back-navigation">
      <a href="informasi-publik.html">
        ← Kembali ke Informasi Publik
      </a>
    </div>

    <div class="publikasi-filter">

  <div class="publikasi-filter-label">
    <span class="publikasi-filter-kicker">
      CARI PUBLIKASI
    </span>

    <strong>
      Pilih Tahun
    </strong>
  </div>

  <div class="publikasi-filter-control">

    <select id="tahunPublikasi">
      <option value="">Semua Tahun</option>
    </select>

  </div>

</div>

      <div id="publikasiContainer">

        <div class="loading-state">
          Memuat publikasi...
        </div>

      </div>

    </section>

  </main>

  <div id="siteFooter"></div>

  <div id="accessibility"></div>


  <!-- Layout -->
  <script src="layout.js"></script>


  <!-- Hero -->
  <script>
  document.addEventListener("layout:loaded", function () {
const kicker =
  document.getElementById("innerHeroKicker");

    const title =
      document.getElementById("innerHeroTitle");

    const description =
      document.getElementById("innerHeroDescription");
if (kicker) {
  kicker.textContent = "STATISTIK";
}
    if (title) {
      title.textContent =
        "Publikasi Statistik";
    }

    if (description) {
      description.textContent =
        "Menyajikan data dan informasi statistik mengenai penyelenggaraan urusan keagamaan dan pendidikan keagamaan di Provinsi Banten.";
    }

  });
  </script>


  <!-- Publikasi -->
 <script>
const API_URL =
  'https://script.google.com/macros/s/AKfycby74M5l9jbsxZOHMq9_svivqRHK9xbK-Ms-iNfSmiggTlUjdnmQbfMC2OeuRVs3M2zT/exec';

document.addEventListener('DOMContentLoaded', function () {

  const container =
    document.getElementById('publikasiContainer');

  const tahunSelect =
    document.getElementById('tahunPublikasi');

  if (!container) return;

  let semuaPublikasi = [];


  function tampilkanPublikasi(data) {

    if (data.length === 0) {

      container.innerHTML = `
        <div class="empty-state">
          Belum ada publikasi pada tahun yang dipilih.
        </div>
      `;

      return;
    }


    container.innerHTML = data.map(function (item) {

      return `
        <article class="publikasi-card">

          <div class="publikasi-cover">

            <img
              src="${item.coverUrl}"
              alt="${item.judul}"
              loading="lazy"
            >

          </div>


          <div class="publikasi-info">

            <span class="publikasi-kategori">
              ${item.kategori || 'Publikasi'}
            </span>

            <h2>
              ${item.judul}
            </h2>

            <div class="publikasi-tahun">
              Tahun ${item.tahun}
            </div>

            <p>
              ${item.deskripsi || ''}
            </p>

            <a
              href="${item.fileUrl}"
              target="_blank"
              rel="noopener noreferrer"
              class="btn-primary"
            >
              Baca Publikasi ↗
            </a>

          </div>

        </article>
      `;

    }).join('');

  }


  fetch(API_URL + '?action=publikasi')

    .then(function (response) {

      if (!response.ok) {
        throw new Error(
          'Gagal menghubungi server.'
        );
      }

      return response.json();

    })

    .then(function (result) {

      if (!result.success) {
        throw new Error(
          result.message ||
          'Data publikasi gagal dimuat.'
        );
      }


      semuaPublikasi =
        result.data || [];


      /*
       * Membuat daftar tahun otomatis
       */

      if (tahunSelect) {

        const tahunList = [
          ...new Set(
            semuaPublikasi
              .map(function (item) {
                return String(item.tahun || '').trim();
              })
              .filter(Boolean)
          )
        ];


        tahunList.sort(function (a, b) {
          return Number(b) - Number(a);
        });


        tahunList.forEach(function (tahun) {

          const option =
            document.createElement('option');

          option.value = tahun;
          option.textContent =
            'Tahun ' + tahun;

          tahunSelect.appendChild(option);

        });


        /*
         * Filter ketika tahun dipilih
         */

        tahunSelect.addEventListener(
          'change',
          function () {

            const tahun =
              tahunSelect.value;

            if (!tahun) {

              tampilkanPublikasi(
                semuaPublikasi
              );

              return;

            }


            const hasilFilter =
              semuaPublikasi.filter(
                function (item) {

                  return String(
                    item.tahun
                  ) === tahun;

                }
              );


            tampilkanPublikasi(
              hasilFilter
            );

          }
        );

      }


      /*
       * Tampilkan semua publikasi
       * saat pertama kali halaman dibuka
       */

      tampilkanPublikasi(
        semuaPublikasi
      );

    })

    .catch(function (error) {

      console.error(error);

      container.innerHTML = `
        <div class="error-state">
          Gagal memuat publikasi.
        </div>
      `;

    });

});
</script>

</body>
</html>
