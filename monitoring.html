<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Monitoring Layanan PPID</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f7f5;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px;
    }

    .header {
      background: #176b45;
      color: white;
      border-radius: 18px;
      padding: 28px 30px;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;

      color: #176b45;
      text-decoration: none;

      font-size: 14px;
      font-weight: 600;
    }

    .back:hover {
      text-decoration: underline;
    }

    .empty-card {
      background: white;
      border-radius: 18px;
      padding: 40px;
      text-align: center;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.05);
    }

    .empty-card h2 {
      margin-top: 0;
      color: #176b45;
    }

    .empty-card p {
      color: #6b7280;
      margin-bottom: 0;
    }

    @media (max-width: 768px) {

      .container {
        padding: 18px;
      }

      .header {
        padding: 22px;
      }

      .header h1 {
        font-size: 22px;
      }

    }

  </style>
</head>


<body>

  <div class="container">

    <a
      href="admin.html"
      class="back"
    >
      ← Kembali ke Admin
    </a>


    <div class="header">

      <h1>
        Monitoring Layanan PPID
      </h1>

      <p>
        Pemantauan permohonan informasi dan keberatan PPID
        Kanwil Kementerian Agama Provinsi Banten
      </p>

    </div>


    <div class="empty-card">

      <h2>
        Monitoring PPID
      </h2>

      <p>
        Halaman monitoring berhasil dibuat.
        Data akan kita hubungkan pada langkah berikutnya.
      </p>

    </div>

  </div>

</body>
</html>
