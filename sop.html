<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SOP - PPID Kanwil Kementerian Agama Provinsi Banten</title>

  <!-- MASTER STYLE -->
  <link rel="stylesheet" href="style.css?v=999">

  <!-- ACCESSIBILITY STYLE -->
  <link rel="stylesheet" href="assets/css/accessibility.css">
</head>

<body>

  <!-- =====================================================
       MASTER NAVBAR
  ====================================================== -->

  <div id="siteNavbar"></div>


  <!-- =====================================================
       MASTER INNER HERO
  ====================================================== -->

  <div id="innerHero"></div>


  <!-- =====================================================
       CONTENT SOP
  ====================================================== -->

  <main>

    <section class="sop-section">

      <div class="sop-container">


        <!-- =================================================
             TOOLBAR
        ================================================== -->

        <div class="sop-toolbar">

          <div class="sop-search">

            <label
              for="searchSOP"
              class="sop-toolbar-label"
            >
              Cari SOP
            </label>

            <input
              type="search"
              id="searchSOP"
              placeholder="Cari nomor atau judul SOP..."
              autocomplete="off"
            >

          </div>


          <div class="sop-filter">

            <label
              for="tahunFilter"
              class="sop-toolbar-label"
            >
              Tahun
            </label>

            <select id="tahunFilter">

              <option value="">
                Semua Tahun
              </option>

            </select>

          </div>


          <div class="sop-filter">

            <label
              for="unitFilter"
              class="sop-toolbar-label"
            >
              Bidang / Unit
            </label>

            <select id="unitFilter">

              <option value="">
                Semua Bidang / Unit
              </option>

            </select>

          </div>

        </div>


        <!-- =================================================
             STATUS
        ================================================== -->

        <div
          id="sopStatus"
          class="sop-status"
          aria-live="polite"
        >
          Memuat data SOP...
        </div>


        <!-- =================================================
             TABLE
        ================================================== -->

        <div class="sop-table-wrapper">

          <table class="sop-table">

            <thead>

              <tr>

                <th class="sop-col-no">
                  No.
                </th>

                <th class="sop-col-nomor">
                  Nomor SOP
                </th>

                <th class="sop-col-judul">
                  Judul SOP
                </th>

                <th class="sop-col-unit">
                  Bidang / Unit
                </th>

                <th class="sop-col-tahun">
                  Tahun
                </th>

                <th class="sop-col-status">
                  Status
                </th>

                <th class="sop-col-dokumen">
                  Dokumen
                </th>

              </tr>

            </thead>


            <tbody id="sopTableBody">

              <tr>

                <td
                  colspan="7"
                  class="sop-loading"
                >
                  Memuat data SOP...
                </td>

              </tr>

            </tbody>

          </table>

        </div>


      </div>

    </section>

  </main>


  <!-- =====================================================
       MASTER FOOTER
  ====================================================== -->

  <div id="siteFooter"></div>


  <!-- =====================================================
       ACCESSIBILITY
  ====================================================== -->

  <div id="accessibility"></div>


  <!-- =====================================================
       MASTER LAYOUT
  ====================================================== -->

  <script src="layout.js"></script>


  <!-- =====================================================
       SOP SCRIPT
  ====================================================== -->

  <script>

    let sopData = [];


    /* =====================================================
       HERO
    ===================================================== */

    document.addEventListener(
      "layout:loaded",
      function () {

        const kicker =
          document.getElementById(
            "innerHeroKicker"
          );

        const title =
          document.getElementById(
            "innerHeroTitle"
          );

        const description =
          document.getElementById(
            "innerHeroDescription"
          );


        if (kicker) {

          kicker.textContent =
            "REGULASI";

        }


        if (title) {

          title.textContent =
            "Standar Operasional Prosedur";

        }


        if (description) {

          description.textContent =
            "Informasi mengenai Standar Operasional Prosedur (SOP) layanan dan pelaksanaan kegiatan di lingkungan Kanwil Kementerian Agama Provinsi Banten.";

        }

      }
    );

const API_URL =
  'https://script.google.com/macros/s/AKfycby74M5l9jbsxZOHMq9_svivqRHK9xbK-Ms-iNfSmiggTlUjdnmQbfMC2OeuRVs3M2zT/exec';
    /* =====================================================
       LOAD SOP
    ===================================================== */

    async function loadSOP() {

      const tableBody =
        document.getElementById(
          "sopTableBody"
        );

      const status =
        document.getElementById(
          "sopStatus"
        );


      try {

        status.textContent =
          "Memuat data SOP...";


        /*
          API_URL diasumsikan sudah tersedia
          dari konfigurasi/layout website.
        */

        const response =
          await fetch(
            API_URL + "?action=sop"
          );


        if (!response.ok) {

          throw new Error(
            "HTTP Error " +
            response.status
          );

        }


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.message ||
            "API SOP mengembalikan success=false"
          );

        }


        sopData =
          Array.isArray(result.data)
            ? result.data
            : [];


        setupSOPFilters();

        renderSOP();


      } catch (error) {

        console.error(
          "Error load SOP:",
          error
        );


        status.textContent =
          "Data SOP tidak dapat dimuat.";


        tableBody.innerHTML = `

          <tr>

            <td
              colspan="7"
              class="sop-empty"
            >

              <strong>
                Data SOP tidak dapat dimuat.
              </strong>

              <br><br>

              ${escapeHTML(
                error.message
              )}

            </td>

          </tr>

        `;

      }

    }


    /* =====================================================
       FILTER
    ===================================================== */

    function setupSOPFilters() {

      const tahunFilter =
        document.getElementById(
          "tahunFilter"
        );

      const unitFilter =
        document.getElementById(
          "unitFilter"
        );


      /*
        TAHUN
      */

      const years = [
        ...new Set(

          sopData

            .map(
              item =>
                item.tahun
            )

            .filter(Boolean)

        )

      ].sort(
        (a, b) =>
          Number(b) -
          Number(a)
      );


      tahunFilter.innerHTML = `

        <option value="">
          Semua Tahun
        </option>

        ${
          years
            .map(
              year => `

                <option
                  value="${escapeAttribute(year)}"
                >
                  ${escapeHTML(year)}
                </option>

              `
            )
            .join("")
        }

      `;


      /*
        BIDANG / UNIT
      */

      const units = [
        ...new Set(

          sopData

            .map(
              item =>
                item.unit
            )

            .filter(Boolean)

        )

      ].sort(
        (a, b) =>
          String(a).localeCompare(
            String(b),
            "id"
          )
      );


      unitFilter.innerHTML = `

        <option value="">
          Semua Bidang / Unit
        </option>

        ${
          units
            .map(
              unit => `

                <option
                  value="${escapeAttribute(unit)}"
                >
                  ${escapeHTML(unit)}
                </option>

              `
            )
            .join("")
        }

      `;

    }


    /* =====================================================
       RENDER SOP
    ===================================================== */

    function renderSOP() {

      const tableBody =
        document.getElementById(
          "sopTableBody"
        );

      const status =
        document.getElementById(
          "sopStatus"
        );


      const search =
        document
          .getElementById(
            "searchSOP"
          )
          .value
          .toLowerCase()
          .trim();


      const tahun =
        document.getElementById(
          "tahunFilter"
        ).value;


      const unit =
        document.getElementById(
          "unitFilter"
        ).value;


      const filtered =
        sopData.filter(
          function (item) {


            /*
              TEKS YANG DICARI
            */

            const text = [

              item.id,
              item.nomor,
              item.judul,
              item.unit,
              item.tahun,
              item.keterangan

            ]

              .filter(Boolean)

              .join(" ")

              .toLowerCase();


            /*
              SEARCH
            */

            const matchSearch =
              !search ||
              text.includes(search);


            /*
              TAHUN
            */

            const matchTahun =
              !tahun ||
              String(
                item.tahun || ""
              ) === String(tahun);


            /*
              UNIT / BIDANG
            */

            const matchUnit =
              !unit ||
              String(
                item.unit || ""
              ) === String(unit);


            return (
              matchSearch &&
              matchTahun &&
              matchUnit
            );

          }
        );
/*
  URUTKAN BERDASARKAN
  TANGGAL UPDATE TERBARU
  KE TERLAMA
*/

filtered.sort(function (a, b) {

  const dateA =
    new Date(a.tanggal_update);

  const dateB =
    new Date(b.tanggal_update);


  const timeA =
    isNaN(dateA.getTime())
      ? 0
      : dateA.getTime();

  const timeB =
    isNaN(dateB.getTime())
      ? 0
      : dateB.getTime();


  return timeB - timeA;

});


      status.textContent =
        filtered.length +
        " SOP ditemukan";


      /*
        TIDAK ADA DATA
      */

      if (!filtered.length) {

        tableBody.innerHTML = `

          <tr>

            <td
              colspan="7"
              class="sop-empty"
            >

              Tidak ada SOP yang sesuai
              dengan pencarian atau filter.

            </td>

          </tr>

        `;

        return;

      }


      /*
        DATA ADA
      */

      tableBody.innerHTML =

        filtered

          .map(
            function (item, index) {


              const nomor =
                item.nomor ||
                item.id ||
                "-";


              const judul =
                item.judul ||
                "Tanpa Judul";


              const unitText =
                item.unit ||
                "-";


              const tahunText =
                item.tahun ||
                "-";


              const statusText =
                item.status ||
                "Berlaku";


              const documentUrl =
                item.url_dokumen
                  ? String(
                      item.url_dokumen
                    ).trim()
                  : "";


              const tanggal =
                formatTanggal(
                  item.tanggal_update
                );


              /*
                STATUS CLASS
              */

              const normalizedStatus =
                String(
                  statusText
                )
                  .toLowerCase()
                  .trim();


              let badgeClass =
                "sop-badge";


              if (

                normalizedStatus.includes(
                  "arsip"
                )

                ||

                normalizedStatus.includes(
                  "tidak berlaku"
                )

              ) {

                badgeClass +=
                  " sop-badge-arsip";

              }


              return `

                <tr>

                  <!-- NO -->

                  <td
                    class="sop-col-no"
                  >

                    ${
                      index + 1
                    }

                  </td>


                  <!-- NOMOR -->

                  <td
                    class="sop-col-nomor"
                  >

                    <div class="sop-nomor">

                      ${escapeHTML(
                        nomor
                      )}

                    </div>

                  </td>


                  <!-- JUDUL -->

                  <td
                    class="sop-col-judul"
                  >

                    <div class="sop-judul">

                      ${escapeHTML(
                        judul
                      )}

                    </div>


                    ${
                      item.keterangan
                        ? `

                          <div
                            class="sop-keterangan"
                          >

                            ${escapeHTML(
                              item.keterangan
                            )}

                          </div>

                        `
                        : ""
                    }


                    ${
                      tanggal !== "-"
                        ? `

                          <div
                            class="sop-tanggal"
                          >

                            Diperbarui:
                            ${escapeHTML(
                              tanggal
                            )}

                          </div>

                        `
                        : ""
                    }

                  </td>


                  <!-- UNIT -->

                  <td
                    class="sop-col-unit"
                  >

                    ${escapeHTML(
                      unitText
                    )}

                  </td>


                  <!-- TAHUN -->

                  <td
                    class="sop-col-tahun"
                  >

                    ${escapeHTML(
                      tahunText
                    )}

                  </td>


                  <!-- STATUS -->

                  <td
                    class="sop-col-status"
                  >

                    <span
                      class="${badgeClass}"
                    >

                      ${escapeHTML(
                        statusText
                      )}

                    </span>

                  </td>


                  <!-- DOKUMEN -->

                  <td
                    class="sop-col-dokumen"
                  >

                    ${
                      documentUrl

                        ? `

                          <a
                            class="sop-button"
                            href="${escapeAttribute(
                              documentUrl
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                          >

                            Lihat

                          </a>


                          ${
                            item.format
                              ? `

                                <span
                                  class="sop-format"
                                >

                                  ${escapeHTML(
                                    item.format
                                  )}

                                </span>

                              `
                              : ""
                          }

                        `

                        : `

                          <span
                            class="sop-no-document"
                          >

                            Belum tersedia

                          </span>

                        `
                    }

                  </td>

                </tr>

              `;

            }
          )

          .join("");

    }


    /* =====================================================
       FORMAT TANGGAL
    ===================================================== */

    function formatTanggal(value) {

      if (!value) {

        return "-";

      }


      const date =
        new Date(value);


      if (
        isNaN(
          date.getTime()
        )
      ) {

        return String(value);

      }


      return date.toLocaleDateString(
        "id-ID",
        {
          day: "2-digit",
          month: "long",
          year: "numeric"
        }
      );

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(value) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    function escapeAttribute(value) {

      return escapeHTML(value);

    }


    /* =====================================================
       EVENTS
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function () {


        const searchInput =
          document.getElementById(
            "searchSOP"
          );


        const tahunFilter =
          document.getElementById(
            "tahunFilter"
          );


        const unitFilter =
          document.getElementById(
            "unitFilter"
          );


        if (searchInput) {

          searchInput.addEventListener(
            "input",
            renderSOP
          );

        }


        if (tahunFilter) {

          tahunFilter.addEventListener(
            "change",
            renderSOP
          );

        }


        if (unitFilter) {

          unitFilter.addEventListener(
            "change",
            renderSOP
          );

        }


        /*
          Load setelah DOM siap.
        */

        loadSOP();

      }
    );

  </script>


</body>
</html>
