<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    PPID Unit - PPID Kanwil Kemenag Banten
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* =========================================================
       PPID UNIT
    ========================================================= */

    .ppid-unit-page {
      background: #f6f8f6;
    }

    .ppid-unit-content {
      padding: 48px 0 76px;
    }

    /* =========================================================
       SECTION HEADING
    ========================================================= */

    .ppid-unit-heading {
      margin-bottom: 24px;
    }

    .ppid-unit-kicker {
      display: block;

      margin-bottom: 7px;

      color: #4d7864;

      font-size: 11px;
      font-weight: 750;

      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    .ppid-unit-heading h2 {
      margin: 0;

      color: #203b2d;

      font-size: 27px;
      line-height: 1.35;
      font-weight: 750;
    }

    .ppid-unit-line {
      width: 44px;
      height: 3px;

      margin-top: 12px;

      border-radius: 5px;

      background: #cdb082;
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    .ppid-unit-search {
      margin-bottom: 24px;

      padding: 18px;

      background: #ffffff;

      border: 1px solid #e1e8e3;
      border-radius: 15px;

      box-shadow:
        0 8px 24px rgba(23, 53, 42, 0.045);
    }

    .ppid-unit-search-label {
      display: block;

      margin-bottom: 8px;

      color: #405148;

      font-size: 13px;
      font-weight: 700;
    }

    .ppid-unit-search-wrapper {
      position: relative;
    }

    .ppid-unit-search-wrapper::before {
      content: "⌕";

      position: absolute;

      left: 14px;
      top: 50%;

      transform: translateY(-50%);

      color: #809087;

      font-size: 20px;

      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      min-height: 46px;

      padding: 11px 14px 11px 42px;

      border: 1px solid #d7e1db;
      border-radius: 9px;

      outline: none;

      background: #ffffff;
      color: #29372f;

      font-family: inherit;
      font-size: 14px;
    }

    #searchInput::placeholder {
      color: #98a39d;
    }

    #searchInput:focus {
      border-color: #5b8b73;

      box-shadow:
        0 0 0 3px rgba(31, 90, 67, 0.08);
    }

    /* =========================================================
       STATUS
    ========================================================= */

    .ppid-unit-status {
      margin: 0 0 16px;

      color: #748179;

      font-size: 13px;
    }

    /* =========================================================
       UNIT GRID
    ========================================================= */

    .ppid-unit-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 20px;
    }

    /* =========================================================
       UNIT CARD
    ========================================================= */

    .ppid-unit-card {
      background: #ffffff;

      border: 1px solid #e1e8e3;
      border-radius: 16px;

      padding: 23px;

      box-shadow:
        0 7px 25px rgba(23, 53, 42, 0.045);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
    }

    .ppid-unit-card:hover {
      transform: translateY(-2px);

      border-color: #d5e1da;

      box-shadow:
        0 12px 30px rgba(23, 53, 42, 0.08);
    }

    /* =========================================================
       UNIT HEADER
    ========================================================= */

    .ppid-unit-header {
      display: flex;

      align-items: center;

      gap: 15px;
    }

    .ppid-unit-logo {
      width: 68px;
      height: 68px;

      flex: 0 0 68px;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 10px;

      border: 1px solid #e0e8e3;
      border-radius: 12px;

      background: #f7faf8;
    }

    .ppid-unit-logo img {
      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    .ppid-unit-title {
      min-width: 0;
    }

    .ppid-unit-title h3 {
      margin: 0;

      color: #203b2d;

      font-size: 18px;
      line-height: 1.4;
      font-weight: 750;
    }

    /* =========================================================
       UNIT DETAILS
    ========================================================= */

    .ppid-unit-details {
      display: grid;

      gap: 11px;

      margin-top: 21px;
      padding-top: 18px;

      border-top: 1px solid #edf1ee;
    }

    .ppid-unit-detail {
      display: grid;

      grid-template-columns:
        76px minmax(0, 1fr);

      gap: 12px;

      font-size: 13px;
      line-height: 1.55;
    }

    .ppid-unit-label {
      color: #4a574f;
      font-weight: 700;
    }

    .ppid-unit-value {
      min-width: 0;

      color: #68756d;

      overflow-wrap: anywhere;
    }

    .ppid-unit-value a {
      color: #1f6a4b;

      font-weight: 600;

      text-decoration: none;
    }

    .ppid-unit-value a:hover {
      text-decoration: underline;
    }

    /* =========================================================
       EMPTY / ERROR
    ========================================================= */

    .ppid-unit-empty {
      grid-column: 1 / -1;

      padding: 45px 20px;

      border: 1px dashed #ccd8d0;
      border-radius: 15px;

      background: #ffffff;

      color: #748078;

      text-align: center;

      font-size: 14px;
    }

    /* =========================================================
       ACCESSIBILITY
       Mengikuti class dari layout.js
    ========================================================= */

    html.accessibility-high-contrast
    .ppid-unit-card,

    html.accessibility-high-contrast
    .ppid-unit-search,

    html.accessibility-high-contrast
    .ppid-unit-empty {

      border-color: #000000 !important;
    }

    html.accessibility-high-contrast
    .ppid-unit-page {

      background: #ffffff !important;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 820px) {

      .ppid-unit-grid {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 600px) {

      .ppid-unit-content {
        padding: 36px 0 58px;
      }

      .ppid-unit-heading h2 {
        font-size: 23px;
      }

      .ppid-unit-card {
        padding: 18px;
      }

      .ppid-unit-header {
        gap: 12px;
      }

      .ppid-unit-logo {
        width: 58px;
        height: 58px;

        flex-basis: 58px;

        padding: 8px;
      }

      .ppid-unit-title h3 {
        font-size: 16px;
      }

      .ppid-unit-detail {
        grid-template-columns: 1fr;
        gap: 2px;
      }

    }

  </style>

</head>


<body>

  <!-- =======================================================
       NAVBAR
       Diisi otomatis oleh layout.js
  ======================================================== -->

  <div id="siteNavbar"></div>


  <!-- =======================================================
       INNER HERO
       Diisi otomatis oleh layout.js
  ======================================================== -->

  <div id="innerHero"></div>


  <!-- =======================================================
       CONTENT
  ======================================================== -->

  <main class="ppid-unit-page">

    <div class="container ppid-unit-content">

      <div class="ppid-unit-heading">

        <span class="ppid-unit-kicker">
          JARINGAN LAYANAN INFORMASI
        </span>

        <h2>
          PPID Unit Kementerian Agama Provinsi Banten
        </h2>

        <div class="ppid-unit-line"></div>

      </div>


      <!-- ===================================================
           SEARCH
      ==================================================== -->

      <div class="ppid-unit-search">

        <label
          class="ppid-unit-search-label"
          for="searchInput"
        >
          Cari PPID Unit
        </label>

        <div class="ppid-unit-search-wrapper">

          <input
            type="text"
            id="searchInput"
            placeholder="Cari nama unit, alamat, email, telepon, atau website..."
            autocomplete="off"
          >

        </div>

      </div>


      <!-- ===================================================
           STATUS
      ==================================================== -->

      <div
        id="status"
        class="ppid-unit-status"
      >
        Memuat data PPID unit...
      </div>


      <!-- ===================================================
           UNIT LIST
      ==================================================== -->

      <div
        id="unitList"
        class="ppid-unit-grid"
      >

        <div class="ppid-unit-empty">
          Memuat data PPID unit...
        </div>

      </div>

    </div>

  </main>


  <!-- =======================================================
       FOOTER
       Diisi otomatis oleh layout.js
  ======================================================== -->

  <div id="siteFooter"></div>


  <!-- =======================================================
       ACCESSIBILITY
       Diisi otomatis oleh layout.js
  ======================================================== -->

  <div id="accessibility"></div>


  <!-- =======================================================
       LAYOUT
  ======================================================== -->

  <script src="layout.js"></script>


  <!-- =======================================================
       PPID UNIT SCRIPT
  ======================================================== -->

  <script>

    /* =========================================================
       API
    ========================================================= */

    const API_URL =
      'https://script.google.com/macros/s/AKfycby74M5l9jbsxZOHMq9_svivqRHK9xbK-Ms-iNfSmiggTlUjdnmQbfMC2OeuRVs3M2zT/exec';


    let unitData = [];


    /* =========================================================
       LOAD DATA
    ========================================================= */

    async function loadUnit() {

      const list =
        document.getElementById("unitList");

      const status =
        document.getElementById("status");

      try {

        status.textContent =
          "Memuat data PPID unit...";


        const response =
          await fetch(
            API_URL + "?action=ppidUnit"
          );


        if (!response.ok) {

          throw new Error(
            "HTTP Error " +
            response.status
          );

        }


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.message ||
            "API PPID Unit mengembalikan success=false"
          );

        }


        unitData =
          Array.isArray(result.data)

            ? result.data.filter(function(item) {

                return String(
                  item.status || ""
                )
                .trim()
                .toLowerCase() === "published";

              })

            : [];


        renderUnit();


      } catch (error) {

        console.error(
          "Error load PPID unit:",
          error
        );


        status.textContent =
          "Gagal memuat data PPID unit.";


        list.innerHTML = `

          <div class="ppid-unit-empty">

            <strong>
              Data PPID unit tidak dapat dimuat.
            </strong>

            <br><br>

            ${escapeHTML(error.message)}

          </div>

        `;

      }

    }


    /* =========================================================
       RENDER
    ========================================================= */

    function renderUnit() {

      const list =
        document.getElementById("unitList");

      const status =
        document.getElementById("status");

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();


      const filtered =
        unitData.filter(function(item) {

          const text = [

            item.id,
            item.nama_unit,
            item.jenis_unit,
            item.alamat,
            item.email,
            item.telepon,
            item.website

          ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


          return (
            !search ||
            text.includes(search)
          );

        });


      status.textContent =
        filtered.length +
        " unit ditemukan";


      if (!filtered.length) {

        list.innerHTML = `

          <div class="ppid-unit-empty">

            Tidak ada PPID unit yang sesuai
            dengan pencarian.

          </div>

        `;

        return;

      }


      list.innerHTML =
        filtered
          .map(function(item) {

            const nama =
              item.nama_unit ||
              "Nama unit tidak tersedia";


            const alamat =
              item.alamat ||
              "-";


            const email =
              item.email &&
              String(item.email).trim() !== "-"
                ? String(item.email).trim()
                : "";


            const telepon =
              item.telepon &&
              String(item.telepon).trim() !== "-"
                ? String(item.telepon).trim()
                : "";


            const website =
              item.website
                ? String(item.website).trim()
                : "";


            return `

              <article class="ppid-unit-card">

                <div class="ppid-unit-header">

                  <div class="ppid-unit-logo">

                    <img
                      src="assets/logo-kemenag.png"
                      alt="Logo Kementerian Agama"
                    >

                  </div>


                  <div class="ppid-unit-title">

                    <h3>
                      ${escapeHTML(nama)}
                    </h3>

                  </div>

                </div>


                <div class="ppid-unit-details">


                  <div class="ppid-unit-detail">

                    <div class="ppid-unit-label">
                      Alamat
                    </div>

                    <div class="ppid-unit-value">

                      ${escapeHTML(alamat)}

                    </div>

                  </div>


                  <div class="ppid-unit-detail">

                    <div class="ppid-unit-label">
                      Email
                    </div>

                    <div class="ppid-unit-value">

                      ${
                        email

                          ? `

                            <a
                              href="mailto:${escapeAttribute(email)}"
                            >
                              ${escapeHTML(email)}
                            </a>

                          `

                          : "-"
                      }

                    </div>

                  </div>


                  <div class="ppid-unit-detail">

                    <div class="ppid-unit-label">
                      Telepon
                    </div>

                    <div class="ppid-unit-value">

                      ${
                        telepon

                          ? `

                            <a
                              href="tel:${escapeAttribute(
                                telepon.replace(
                                  /[^0-9+]/g,
                                  ""
                                )
                              )}"
                            >
                              ${escapeHTML(telepon)}
                            </a>

                          `

                          : "-"
                      }

                    </div>

                  </div>


                  <div class="ppid-unit-detail">

                    <div class="ppid-unit-label">
                      Website
                    </div>

                    <div class="ppid-unit-value">

                      ${
                        website

                          ? `

                            <a
                              href="${escapeAttribute(
                                website
                              )}"
                              target="_blank"
                              rel="noopener noreferrer"
                            >
                              Kunjungi website ↗
                            </a>

                          `

                          : "-"
                      }

                    </div>

                  </div>


                </div>

              </article>

            `;

          })

          .join("");

    }


    /* =========================================================
       SECURITY
    ========================================================= */

    function escapeHTML(value) {

      return String(value ?? "")

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function escapeAttribute(value) {

      return escapeHTML(value);

    }


    /* =========================================================
       SEARCH
    ========================================================= */

    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        renderUnit
      );


    /* =========================================================
       START
    ========================================================= */

    loadUnit();

  </script>


</body>

</html>
