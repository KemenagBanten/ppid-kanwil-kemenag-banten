<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Regulasi - PPID Kanwil Kementerian Agama Provinsi Banten</title>

  <link rel="stylesheet" href="style.css?v=999">

  <style>
    /* =========================================================
       REGULASI
    ========================================================= */

    .regulasi-page {
      padding: 60px 0 80px;
    }

    .regulasi-intro {
      margin-bottom: 28px;
    }

    .regulasi-intro .section-kicker {
      margin-bottom: 8px;
    }

    .regulasi-intro h2 {
      margin: 0 0 10px;
    }

    .regulasi-intro p {
      margin: 0;
      max-width: 850px;
      line-height: 1.7;
      color: #66736c;
    }

    /* Toolbar */

    .regulasi-toolbar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .regulasi-search-wrapper {
      position: relative;
      width: 100%;
    }

    .regulasi-search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #7a8781;
      pointer-events: none;
    }

    #regulasiSearchInput {
      width: 100%;
      height: 44px;
      padding: 0 16px 0 44px;
      box-sizing: border-box;
      border: 1px solid #dfe7e2;
      border-radius: 9px;
      background: #ffffff;
      color: #34433b;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    #regulasiSearchInput:focus {
      border-color: #0f5132;
      box-shadow: 0 0 0 3px rgba(15, 81, 50, 0.08);
    }

    .regulasi-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .regulasi-filter-btn {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid #dfe7e2;
      background: #ffffff;
      color: #53615a;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      padding: 9px 15px;
      min-height: 38px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .regulasi-filter-btn:hover {
      background: #f4f8f5;
      border-color: #cbdad1;
      color: #0f5132;
    }

    .regulasi-filter-btn.active {
      background: #0f5132;
      border-color: #0f5132;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(15, 81, 50, 0.12);
    }
.regulasi-sort {
  display: flex;
  align-items: center;
  gap: 8px;
}

.regulasi-sort label {
  color: #66736c;
  font-size: 13px;
  font-weight: 600;
}

#regulasiSort {
  height: 38px;
  padding: 0 12px;
  border: 1px solid #dfe7e2;
  border-radius: 8px;
  background: #ffffff;
  color: #53615a;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  outline: none;
}

#regulasiSort:focus {
  border-color: #0f5132;
  box-shadow: 0 0 0 3px rgba(15, 81, 50, 0.08);
}
    /* Result header */

    .regulasi-result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 12px;
    }

    .regulasi-result-header h3 {
      margin: 0;
      font-size: 18px;
      color: #263a30;
    }

    #regulasiResultCount {
      color: #718078;
      font-size: 12px;
    }

    /* Table */

    .regulasi-data-list {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e9e5;
      border-radius: 15px;
      overflow-x: auto;
      overflow-y: hidden;
      box-shadow: 0 6px 24px rgba(26, 54, 41, 0.045);
    }

    .regulasi-table {
      width: 100%;
      min-width: 1050px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .regulasi-table thead th {
      background: #0f5132;
      color: #ffffff;
      padding: 14px;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      vertical-align: middle;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      white-space: nowrap;
    }

    .regulasi-table thead th:last-child {
      border-right: none;
    }

    .regulasi-table th:nth-child(1),
    .regulasi-table td:nth-child(1) {
      width: 55px;
      text-align: center;
    }

    .regulasi-table th:nth-child(2),
    .regulasi-table td:nth-child(2) {
      width: 17%;
    }

    .regulasi-table th:nth-child(3),
    .regulasi-table td:nth-child(3) {
      width: 31%;
    }

    .regulasi-table th:nth-child(4),
    .regulasi-table td:nth-child(4) {
      width: 19%;
    }

    .regulasi-table th:nth-child(5),
    .regulasi-table td:nth-child(5) {
      width: 9%;
      text-align: center;
    }

    .regulasi-table th:nth-child(6),
    .regulasi-table td:nth-child(6) {
      width: 14%;
      text-align: center;
    }

    .regulasi-table tbody td {
      padding: 15px 14px;
      border-bottom: 1px solid #edf1ee;
      color: #45534c;
      font-size: 13px;
      vertical-align: top;
      line-height: 1.5;
      background: #ffffff;
    }

    .regulasi-table tbody tr:last-child td {
      border-bottom: none;
    }

    .regulasi-table tbody tr:hover td {
      background: #f8fbf9;
    }

    .regulasi-number {
      color: #718078;
      font-size: 12px;
      font-weight: 600;
    }

    .regulasi-number-text {
      color: #263a30;
      font-size: 13px;
      font-weight: 650;
      line-height: 1.5;
    }

    .regulasi-title {
      color: #263a30;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.5;
    }

    .regulasi-category {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 9px;
      border-radius: 6px;
      background: #e9f5ef;
      border: 1px solid #d4e9dd;
      color: #0f5132;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.3;
    }

    .regulasi-year {
      color: #52615a;
      font-size: 12px;
      font-weight: 600;
    }

    .regulasi-document {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 82px;
      padding: 7px 10px;
      background: #0f5132;
      color: #ffffff;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .regulasi-document:hover {
      background: #146c43;
      transform: translateY(-1px);
    }

    .regulasi-document-empty {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 10px;
      background: #eef1ef;
      color: #7b8580;
      border-radius: 7px;
      font-size: 10px;
      white-space: nowrap;
    }

    /* Loading / error / empty */

    #regulasiLoading {
      padding: 45px 20px;
      text-align: center;
      color: #718078;
    }

    #regulasiError {
      display: none;
      margin-bottom: 20px;
      padding: 14px 16px;
      border: 1px solid #f0d4d4;
      border-radius: 9px;
      background: #fff7f7;
      color: #9b4a4a;
      font-size: 13px;
    }

    .regulasi-no-data {
      width: 100%;
      background: #ffffff;
      padding: 55px 20px;
      text-align: center;
      color: #718078;
    }

    .regulasi-no-data-icon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .regulasi-no-data strong {
      display: block;
      color: #435149;
      margin-bottom: 5px;
    }

    /* Pagination */

    .regulasi-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 22px;
    }

    .regulasi-pagination button {
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #dfe7e2;
      border-radius: 7px;
      background: #ffffff;
      color: #53615a;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .regulasi-pagination button:hover {
      background: #f4f8f5;
      color: #0f5132;
    }

    .regulasi-pagination button.active {
      background: #0f5132;
      border-color: #0f5132;
      color: #ffffff;
    }

    .regulasi-pagination button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    @media (max-width: 680px) {
      .regulasi-page {
        padding: 45px 0 60px;
      }

      .regulasi-result-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

      .regulasi-data-list {
        border-radius: 12px;
      }

      .regulasi-table {
        min-width: 1050px;
      }

      .regulasi-table thead th {
        padding: 12px 11px;
        font-size: 11px;
      }

      .regulasi-table tbody td {
        padding: 13px 11px;
        font-size: 12px;
      }

      .regulasi-title {
        font-size: 13px;
      }

      .regulasi-category {
        font-size: 10px;
        padding: 4px 7px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR MASTER -->
  <div id="siteNavbar"></div>

  <!-- HERO MASTER
       Tetap memakai inner-hero.html agar layout vertikal
       konsisten dengan Profil dan halaman lainnya. -->

  <main>
    <section class="regulasi-page">
      <div class="container">

        
        <!-- SEARCH & FILTER -->
        <section class="regulasi-toolbar">

          <div class="regulasi-search-wrapper">
            <span class="regulasi-search-icon">🔎</span>

            <input
              type="text"
              id="regulasiSearchInput"
              placeholder="Cari nomor, judul, tentang, atau kata kunci..."

              type="button"

              class="regulasi-filter-btn"

              type="button"
              class="regulasi-filter-btn"

            >

            </button>
            
<div class="regulasi-sort">
  <label for="regulasiSort">Urutkan:</label>

  <select id="regulasiSort">
    <option value="terbaru">Terbaru → Terlama</option>
    <option value="terlama">Terlama → Terbaru</option>

        <!-- RESULT HEADER -->

  </main>

  <!-- FOOTER MASTER -->
  <div id="siteFooter"></div>

  <!-- ACCESSIBILITY MASTER -->
  <div id="accessibility"></div>

  <script src="layout.js"></script>
<script>
document.addEventListener("layout:loaded", function () {
  const kicker = document.getElementById("innerHeroKicker");
  const title = document.getElementById("innerHeroTitle");
  const description = document.getElementById("innerHeroDescription");

  if (kicker) {
    kicker.textContent = "REGULASI";
  }
  
  if (title) {
    title.textContent =
      "Regulasi Kanwil Kementerian Agama Provinsi Banten";
  }

  if (description) {
    description.textContent =
      "Daftar regulasi yang ditetapkan dan digunakan di lingkungan Kantor Wilayah Kementerian Agama Provinsi Banten.";
  }
});
</script>
  
  <script>
    const REGULASI_API_URL =
      'https://script.google.com/macros/s/AKfycby74M5l9jbsxZOHMq9_svivqRHK9xbK-Ms-iNfSmiggTlUjdnmQbfMC2OeuRVs3M2zT/exec';

    let regulasiData = [];
    let filteredRegulasi = [];
    let regulasiCurrentPage = 1;

    const regulasiPageSize = 10;

    const regulasiSearchInput =
      document.getElementById('regulasiSearchInput');

    const regulasiFilters =
      document.getElementById('regulasiFilters');

    const regulasiResultCount =
      document.getElementById('regulasiResultCount');

    const regulasiLoading =
      document.getElementById('regulasiLoading');

    const regulasiError =
      document.getElementById('regulasiError');

    const regulasiDataList =
      document.getElementById('regulasiDataList');

    const regulasiPagination =
      document.getElementById('regulasiPagination');
const regulasiSort =
  document.getElementById('regulasiSort');
    let activeRegulasiFilter = 'all';


    /* =========================================================
       LOAD DATA
    ========================================================= */

    async function loadRegulasi() {

      regulasiLoading.style.display = 'block';
      regulasiDataList.style.display = 'none';
      regulasiError.style.display = 'none';

      try {

        const response = await fetch(
          REGULASI_API_URL + '?action=regulasi'
        );

        if (!response.ok) {
          throw new Error(
            'HTTP ' + response.status
          );
        }

        const result = await response.json();

        if (!result.success) {
          throw new Error(
            result.message || 'Data regulasi gagal dimuat.'
          );
        }

        regulasiData = Array.isArray(result.data)
          ? result.data
          : [];

        filteredRegulasi = regulasiData.slice();

        regulasiCurrentPage = 1;

        applyRegulasiFilter();

      } catch (error) {

        console.error(
          'Gagal memuat regulasi:',
          error
        );

        regulasiLoading.style.display = 'none';

        regulasiError.textContent =
          'Data regulasi belum dapat dimuat. ' +
          error.message;

        regulasiError.style.display = 'block';

        regulasiResultCount.textContent =
          'Data belum tersedia';

      }

    }


    /* =========================================================
       FILTER
    ========================================================= */

    function applyRegulasiFilter() {

      const keyword =
        regulasiSearchInput.value
          .trim()
          .toLowerCase();

      filteredRegulasi =
        regulasiData.filter(function(row) {

          const nomor =
            String(row.nomor || '').toLowerCase();

          const judul =
            String(row.judul || '').toLowerCase();

          const tentang =
            String(row.tentang || '').toLowerCase();

          const kategori =
            String(
              row.kategori ||
              row.jenis ||
              ''
            ).toLowerCase();

          const matchesSearch =
            !keyword ||
            nomor.includes(keyword) ||
            judul.includes(keyword) ||
            tentang.includes(keyword) ||
            kategori.includes(keyword);

          const kategoriAsli =
            String(
              row.kategori ||
              row.jenis ||
              ''
            ).trim();

          const matchesFilter =
            activeRegulasiFilter === 'all' ||
            kategoriAsli === activeRegulasiFilter;

          return (
            matchesSearch &&
            matchesFilter
          );

        });

      regulasiCurrentPage = 1;

      renderRegulasi();

    }
    filteredRegulasi.sort(function(a, b) {
  const tahunA = Number(a.tahun) || 0;
  const tahunB = Number(b.tahun) || 0;

  if (regulasiSort.value === 'terlama') {
    return tahunA - tahunB;
  }

  return tahunB - tahunA;
});
function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/'/g, "&#039;");
}
    /* =========================================================
       RENDER TABLE
    ========================================================= */

    function renderRegulasi() {

      regulasiLoading.style.display = 'none';
      regulasiDataList.style.display = 'block';

      regulasiPagination.innerHTML = '';

      regulasiResultCount.textContent =
        filteredRegulasi.length +
        ' regulasi tersedia';

      if (!filteredRegulasi.length) {

        regulasiDataList.innerHTML = `
          <div class="regulasi-no-data">

            <div class="regulasi-no-data-icon">
              🔎
            </div>

            <strong>
              Regulasi tidak ditemukan
            </strong>

            <span>
              Coba gunakan kata kunci atau kategori
              yang berbeda.
            </span>

          </div>
        `;

        return;
      }

      const totalPages =
        Math.ceil(
          filteredRegulasi.length /
          regulasiPageSize
        );

      if (
        regulasiCurrentPage >
        totalPages
      ) {
        regulasiCurrentPage =
          totalPages;
      }

      const start =
        (regulasiCurrentPage - 1) *
        regulasiPageSize;

      const end =
        start +
        regulasiPageSize;

      const pageData =
        filteredRegulasi.slice(
          start,
          end
        );

      const table =
        document.createElement('table');

      table.className =
        'regulasi-table';

      table.innerHTML = `
        <thead>
          <tr>
            <th>No.</th>
            <th>Nomor Regulasi</th>
            <th>Judul / Tentang</th>
            <th>Kategori</th>
            <th>Tahun</th>
            <th>Dokumen</th>
          </tr>
        </thead>

        <tbody></tbody>
      `;

      const tbody =
        table.querySelector('tbody');


      pageData.forEach(
        function(row, index) {

          const tr =
            document.createElement('tr');

          const nomorUrut =
            start + index + 1;

          const nomor =
            row.nomor || '-';

          const judul =
            row.judul || '-';

          const tentang =
            row.tentang || '';

          const kategori =
            row.kategori ||
            row.jenis ||
            '-';

          const tahun =
            row.tahun || '-';

          const urlDokumen =
            row.url_dokumen || '';


         let judulHTML = '';

if (tentang) {
  judulHTML = `
    <div
      style="
        color:#263a30;
        font-size:14px;
        font-weight:650;
        line-height:1.5;
      "
    >
      ${escapeHTML(tentang)}
    </div>

    <div
      style="
        margin-top:5px;
        color:#718078;
        font-size:12px;
        font-weight:400;
        line-height:1.5;
      "
    >
      ${escapeHTML(judul)}
    </div>
  `;
} else {
  judulHTML = `
    <div
      style="
        color:#263a30;
        font-size:14px;
        font-weight:650;
        line-height:1.5;
      "
    >
      ${escapeHTML(judul)}
    </div>
  `;
}
          let dokumenHTML;

          if (urlDokumen) {

            dokumenHTML = `
              <a
                href="${escapeAttribute(urlDokumen)}"
                class="regulasi-document"
                target="_blank"
                rel="noopener noreferrer"
              >
                Lihat
              </a>
            `;

          } else {

            dokumenHTML = `
              <span class="regulasi-document-empty">
                Belum tersedia
              </span>
            `;

          }


          tr.innerHTML = `
            <td>
              <span class="regulasi-number">
                ${nomorUrut}
              </span>
            </td>

            <td>
              <div class="regulasi-number-text">
                ${escapeHTML(nomor)}
              </div>
            </td>

            <td>
              <div class="regulasi-title">
                ${judulHTML}
              </div>
            </td>

            <td>
              <span class="regulasi-category">
                ${escapeHTML(kategori)}
              </span>
            </td>

            <td>
              <span class="regulasi-year">
                ${escapeHTML(tahun)}
              </span>
            </td>

            <td>
              ${dokumenHTML}
            </td>
          `;

          tbody.appendChild(tr);

        }
      );


      regulasiDataList.innerHTML = '';

      regulasiDataList.appendChild(table);

      renderRegulasiPagination(
        filteredRegulasi.length,
        totalPages
      );

    }


    /* =========================================================
       PAGINATION
    ========================================================= */

    function renderRegulasiPagination(
      totalItems,
      totalPages
    ) {

      if (totalPages <= 1) {
        return;
      }

      const previous =
        document.createElement('button');

      previous.type = 'button';
      previous.textContent = '‹';
      previous.disabled =
        regulasiCurrentPage === 1;

      previous.addEventListener(
        'click',
        function() {

          if (
            regulasiCurrentPage > 1
          ) {

            regulasiCurrentPage--;

            renderRegulasi();

            window.scrollTo({
              top: 0,
              behavior: 'smooth'
            });

          }

        }
      );

      regulasiPagination.appendChild(
        previous
      );


      for (
        let page = 1;
        page <= totalPages;
        page++
      ) {

        const button =
          document.createElement('button');

        button.type = 'button';

        button.textContent = page;

        if (
          page ===
          regulasiCurrentPage
        ) {
          button.classList.add('active');
        }

        button.addEventListener(
          'click',
          function() {

            regulasiCurrentPage =
              page;

            renderRegulasi();

            window.scrollTo({
              top: 0,
              behavior: 'smooth'
            });

          }
        );

        regulasiPagination.appendChild(
          button
        );

      }


      const next =
        document.createElement('button');

      next.type = 'button';
      next.textContent = '›';

      next.disabled =
        regulasiCurrentPage === totalPages;

      next.addEventListener(
        'click',
        function() {

          if (
            regulasiCurrentPage <
            totalPages
          ) {

            regulasiCurrentPage++;

            renderRegulasi();

            window.scrollTo({
              top: 0,
              behavior: 'smooth'
            });

          }

        }
      );

      regulasiPagination.appendChild(
        next
      );

    }


    /* =========================================================
       SEARCH
    ========================================================= */

    regulasiSearchInput.addEventListener(
      'input',
      function() {
        applyRegulasiFilter();
      }
    );

regulasiSort.addEventListener(
  'change',
  function() {
    applyRegulasiFilter();
  }
);
    /* =========================================================
       FILTER BUTTON
    ========================================================= */

    regulasiFilters
      .querySelectorAll(
        '.regulasi-filter-btn'
      )
      .forEach(
        function(button) {

          button.addEventListener(
            'click',
            function() {

              regulasiFilters
                .querySelectorAll(
                  '.regulasi-filter-btn'
                )
                .forEach(
                  function(item) {
                    item.classList.remove(
                      'active'
                    );
                  }
                );

              button.classList.add(
                'active'
              );

              activeRegulasiFilter =
                button.dataset.filter;

              applyRegulasiFilter();

            }
          );

        }
      );


    /* =========================================================
       START
    ========================================================= */

    document.addEventListener(
      'layout:loaded',
      function() {

        /*
         * Hero tetap menggunakan
         * components/inner-hero.html.
         *
         * Jangan membuat Hero baru di halaman ini,
         * agar bentuknya konsisten dengan Profil.
         */

        loadRegulasi();

      }
    );

  </script>

</body>
</html>
