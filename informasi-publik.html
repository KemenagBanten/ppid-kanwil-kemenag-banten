<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Informasi Publik PPID Kanwil Kementerian Agama Provinsi Banten"
  >

  <title>
    Informasi Publik | PPID Kanwil Kemenag Banten
  </title>
<link rel="stylesheet" href="style.css?v=999">

  <style>

    /* =====================================================
       MAIN
    ===================================================== */

  main {
  max-width: 1200px;
  margin: auto;
  padding: 60px 24px 80px;
}


/* =====================================================
   INFORMASI PUBLIK - NAVIGASI UTAMA
===================================================== */

.informasi-navigation {
  width: 100%;
}


/* =====================================================
   KARTU JENIS INFORMASI
===================================================== */

.informasi-type-cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  width: 100%;
}
    
.informasi-type-card {
  appearance: none;
  -webkit-appearance: none;

  width: 100%;
  min-height: 112px;
  padding: 20px;

  display: flex;
  align-items: center;
  gap: 15px;

  text-align: left;

  background: #ffffff;
  border: 1px solid #dfe7e2;
  border-radius: 14px;

  color: #34433b;
  cursor: pointer;

  font-family: Inter, "Segoe UI", Arial, sans-serif;
  font-size: 13px;
  line-height: 1.45;

  transition:
    border-color 0.2s ease,
    background 0.2s ease,
    box-shadow 0.2s ease,
    transform 0.2s ease;
}

.informasi-type-card:hover {
  background: #f8fbf9;
  border-color: #bfd4c8;
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(26, 54, 41, 0.06);
}

.informasi-type-card.active {
  background: #f1f7f4;
  border-color: #0f5132;
  box-shadow: 0 6px 18px rgba(15, 81, 50, 0.08);
}

.informasi-type-icon {
  width: 44px;
  height: 44px;

  flex: 0 0 44px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 11px;
  background: #e9f5ef;

  font-size: 20px;
  line-height: 1;
}

.informasi-type-content {
  min-width: 0;

  display: flex;
  flex-direction: column;
  gap: 5px;
}

.informasi-type-content strong {
  color: #263a30;

  font-family: Inter, "Segoe UI", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.35;
  font-weight: 700;
}

.informasi-type-content small {
  color: #718078;

  font-family: Inter, "Segoe UI", Arial, sans-serif;
  font-size: 12px;
  line-height: 1.45;
  font-weight: 400;
}

.informasi-type-arrow {
  margin-left: auto;

  color: #789087;

  font-family: "Segoe UI", Arial, sans-serif;
  font-size: 22px;
  line-height: 1;
}

.informasi-type-card.active .informasi-type-arrow {
  color: #0f5132;
}
/* =====================================================
   PANEL KATEGORI
===================================================== */

.kategori-panel {
  margin-top: 36px;
}

.kategori-header {
  margin-bottom: 16px;
}

.kategori-eyebrow {
  display: block;

  margin-bottom: 5px;

  color: #0f5132;

  font-size: 10px;
  font-weight: 750;

  letter-spacing: 0.08em;
}

.kategori-header h2,
.dokumen-panel-title h2,
.serta-merta-content h2 {
  margin: 0;

  color: #263a30;

  font-size: 20px;
  font-weight: 700;
}

.kategori-header p {
  margin: 7px 0 0;

  color: #718078;

  font-size: 13px;
  line-height: 1.5;
}


/* =====================================================
   DAFTAR KATEGORI
===================================================== */

.kategori-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.kategori-item {
  appearance: none;
  -webkit-appearance: none;

  width: 100%;

  min-height: 52px;

  padding: 12px 15px;

  display: flex;
  align-items: center;

  background: #ffffff;

  border: 1px solid #e2e9e5;
  border-radius: 9px;

  color: #34433b;

  font-family: inherit;
  font-size: 13px;
  font-weight: 600;

  text-align: left;

  cursor: pointer;

  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    color 0.2s ease,
    transform 0.2s ease;
}

.kategori-item:hover {
  background: #f5f9f6;
  border-color: #bfd4c8;
  color: #0f5132;
  transform: translateX(2px);
}

.kategori-item::after {
  content: "›";

  margin-left: auto;

  color: #8a9891;

  font-size: 20px;
  font-weight: 400;
}

.kategori-item:hover::after {
  color: #0f5132;
}


/* =====================================================
   PANEL SERTA MERTA
===================================================== */

.serta-merta-panel {
  margin-top: 36px;

  display: flex;
  align-items: flex-start;
  gap: 18px;

  padding: 25px;

  background: #ffffff;

  border: 1px solid #e2e9e5;
  border-radius: 14px;

  box-shadow:
    0 6px 24px rgba(26, 54, 41, 0.045);
}

.serta-merta-icon {
  width: 46px;
  height: 46px;

  flex: 0 0 46px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 11px;

  background: #f1f7f4;

  font-size: 21px;
}

.serta-merta-content {
  flex: 1;
}

.serta-merta-content p {
  margin: 8px 0 16px;

  color: #68766f;

  font-size: 13px;
  line-height: 1.6;
}



 

/* =====================================================
   PANEL DOKUMEN
===================================================== */

.dokumen-panel {
  margin-top: 36px;
}

.dokumen-panel-header {
  display: flex;
  align-items: flex-start;
  gap: 18px;

  margin-bottom: 18px;
}

.back-button {
  flex: 0 0 auto;

  border: 1px solid #dfe7e2;

  background: #ffffff;

  color: #52615a;

  padding: 8px 12px;

  border-radius: 8px;

  font-family: inherit;

  font-size: 12px;
  font-weight: 600;

  cursor: pointer;

  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    color 0.2s ease;
}

.back-button:hover {
  background: #f1f7f4;
  border-color: #bfd4c8;
  color: #0f5132;
}

.dokumen-panel-title {
  min-width: 0;
}


/* =====================================================
   TOOLBAR DOKUMEN
===================================================== */

.dokumen-toolbar {
  display: flex;
  align-items: center;
  gap: 14px;

  margin-bottom: 10px;
}

.dokumen-toolbar .search-wrapper {
  flex: 1;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 800px) {

  .informasi-type-cards {
    grid-template-columns: 1fr;
  }

  .kategori-list {
    grid-template-columns: 1fr;
  }

}


@media (max-width: 680px) {

  .informasi-type-card {
    min-height: 96px;
    padding: 16px;
  }

  .informasi-type-icon {
    width: 40px;
    height: 40px;
    flex-basis: 40px;
    font-size: 18px;
  }

  .kategori-panel,
  .dokumen-panel,
  .serta-merta-panel {
    margin-top: 28px;
  }

  .dokumen-panel-header {
    flex-direction: column;
    gap: 10px;
  }

  .dokumen-toolbar {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }

  .dokumen-toolbar .informasi-sort {
    justify-content: flex-start;
  }

}
    /* =====================================================
       RESULT HEADER
    ===================================================== */

   .result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
     margin-top: 36px;
  margin-bottom: 12px;
}

.result-header h2 {
  margin: 0;
  font-size: 18px;
  color: #263a30;
}

#resultCount {
  color: #718078;
  font-size: 12px;
}

    /* =====================================================
       ERROR
    ===================================================== */

    #error {

      display:
        none;

      background:
        #fff3f3;

      border:
        1px solid #f0cccc;

      color:
        #9b3030;

      border-radius:
        12px;

      padding:
        15px 18px;

      margin-bottom:
        20px;

      font-size:
        14px;
    }


    /* =====================================================
       LOADING
    ===================================================== */

    #loading {

      background:
        #ffffff;

      border:
        1px solid #e3e9e5;

      border-radius:
        15px;

      padding:
        45px 20px;

      text-align:
        center;

      color:
        #68766f;

      box-shadow:
        0 5px 20px rgba(0,0,0,.03);
    }


    .spinner {

      width:
        30px;

      height:
        30px;

      border:
        3px solid #dce8e1;

      border-top-color:
        #198754;

      border-radius:
        50%;

      animation:
        spin .8s linear infinite;

      margin:
        0 auto 14px;
    }


    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }


 /* =====================================================
   TABEL INFORMASI PUBLIK
===================================================== */

.data-list {
  width: 100%;
  background: #ffffff;
  border: 1px solid #e2e9e5;
  border-radius: 15px;
  overflow-x: auto;
  overflow-y: hidden;
  box-shadow: 0 6px 24px rgba(26, 54, 41, 0.045);
}


/* =====================================================
   TABLE
===================================================== */

.informasi-table {
  width: 100%;
  min-width: 1050px;
  border-collapse: collapse;
  table-layout: fixed;
}


/* =====================================================
   TABLE HEADER
===================================================== */

.informasi-table thead th {
  background: #0f5132;
  color: #ffffff;

  padding: 14px 14px;

  font-size: 12px;
  font-weight: 700;

  text-align: left;
  vertical-align: middle;

  border-right: 1px solid rgba(255, 255, 255, 0.12);
  white-space: nowrap;
}

.informasi-table thead th:last-child {
  border-right: none;
}


/* =====================================================
   COLUMN WIDTH
===================================================== */

.informasi-table th:nth-child(1),
.informasi-table td:nth-child(1) {
  width: 55px;
  text-align: center;
}

.informasi-table th:nth-child(2),
.informasi-table td:nth-child(2) {
  width: 45%;
}

.informasi-table th:nth-child(3),
.informasi-table td:nth-child(3) {
  width: 13%;
}

.informasi-table th:nth-child(4),
.informasi-table td:nth-child(4) {
  width: 7%;
  text-align: center;
  white-space: nowrap;
}

.informasi-table th:nth-child(5),
.informasi-table td:nth-child(5) {
  width: 15%;
  text-align: center;
}

.informasi-table th:nth-child(6),
.informasi-table td:nth-child(6) {
  width: 15%;
  text-align: center;
}
    
    /* =====================================================
   TABLE BODY
===================================================== */

.informasi-table tbody td {
  padding: 15px 14px;

  border-bottom: 1px solid #edf1ee;

  color: #45534c;

  font-size: 13px;

  vertical-align: top;

  line-height: 1.5;

  background: #ffffff;
}

.informasi-table tbody tr:last-child td {
  border-bottom: none;
}


/* =====================================================
   HOVER
===================================================== */

.informasi-table tbody tr:hover td {
  background: #f8fbf9;
}


/* =====================================================
   NOMOR
===================================================== */

.table-number {
  color: #718078;
  font-size: 12px;
  font-weight: 600;
}


/* =====================================================
   JUDUL INFORMASI
===================================================== */

.table-title {
  color: #263a30;

  font-size: 14px;
  font-weight: 650;

  line-height: 1.5;
}


/* =====================================================
   JENIS INFORMASI
===================================================== */

.table-badge {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  padding: 5px 9px;

  border-radius: 6px;

  background: #e9f5ef;

  border: 1px solid #d4e9dd;

  color: #0f5132;

  font-size: 11px;
  font-weight: 600;

  line-height: 1.2;
}

.table-badge.empty {
  background: #f5f7f6;
  border-color: #e3e9e5;
  color: #7a8781;
}


/* =====================================================
   TAHUN
===================================================== */

.table-year {
  color: #52615a;
  font-size: 12px;
  font-weight: 600;
}


/* =====================================================
   TANGGAL
===================================================== */

.table-date {
  color: #718078;
  font-size: 12px;
}


/* =====================================================
   DOKUMEN
===================================================== */

.table-documents {
  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 6px;
}


/* =====================================================
   BUTTON DOKUMEN
===================================================== */

.table-document-button {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  min-width: 82px;

  padding: 7px 10px;

  background: #0f5132;

  color: #ffffff;

  border-radius: 7px;

  font-size: 11px;
  font-weight: 600;

  text-decoration: none;

  transition:
    background 0.2s ease,
    transform 0.2s ease;
}

.table-document-button:hover {
  background: #146c43;

  transform: translateY(-1px);
}


/* =====================================================
   MULTIPLE DOCUMENT
===================================================== */

.table-document-name {
  max-width: 145px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

  color: #64736b;

  font-size: 10px;
}


/* =====================================================
   DOKUMEN BELUM TERSEDIA
===================================================== */

.table-document-empty {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  padding: 7px 10px;

  background: #eef1ef;

  color: #7b8580;

  border-radius: 7px;

  font-size: 10px;

  white-space: nowrap;
}


/* =====================================================
   NO DATA
===================================================== */

.no-data {
  width: 100%;

  background: #ffffff;

  padding: 55px 20px;

  text-align: center;

  color: #718078;
}

.no-data-icon {
  font-size: 34px;

  margin-bottom: 10px;
}

.no-data strong {
  display: block;

  color: #435149;

  margin-bottom: 5px;
}


/* =====================================================
   RESPONSIVE TABLE
===================================================== */

@media (max-width: 680px) {

  .data-list {
    border-radius: 12px;
  }

  .informasi-table {
    min-width: 950px;
  }

  .informasi-table thead th {
    padding: 12px 11px;

    font-size: 11px;
  }

  .informasi-table tbody td {
    padding: 13px 11px;

    font-size: 12px;
  }

  .table-title {
    font-size: 13px;
  }

  .table-badge {
    font-size: 10px;

    padding: 4px 7px;
  }

}

    /* =====================================================
       NO DATA
    ===================================================== */

    .no-data {

      width:
        100%;

      background:
        #ffffff;

      padding:
        55px 20px;

      text-align:
        center;

      color:
        #718078;
    }


    .no-data-icon {

      font-size:
        34px;

      margin-bottom:
        10px;
    }


    .no-data strong {

      display:
        block;

      color:
        #435149;

      margin-bottom:
        5px;
    }


    /* =====================================================
       PAGINATION
    ===================================================== */

    .pagination {

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      gap:
        6px;

      margin-top:
        24px;

      flex-wrap:
        wrap;
    }


    .pagination button {

      min-width:
        36px;

      height:
        36px;

      padding:
        0 10px;

      border:
        1px solid #d9e4de;

      border-radius:
        8px;

      background:
        #ffffff;

      color:
        #315244;

      font-size:
        13px;

      font-weight:
        600;

      cursor:
        pointer;

      transition:
        all .2s ease;
    }


    .pagination button:hover {

      background:
        #f1f7f4;

      border-color:
        #b8cfc3;
    }


    .pagination button.active {

      background:
        #1f5a43;

      border-color:
        #1f5a43;

      color:
        #ffffff;
    }


    .pagination button:disabled {

      opacity:
        .45;

      cursor:
        not-allowed;
    }


    .pagination-info {

      width:
        100%;

      text-align:
        center;

      margin-bottom:
        8px;

      color:
        #71847a;

      font-size:
        12px;
    }


   @media (max-width: 680px) {

       main {

        padding:
          30px 18px 55px;
      }


      .result-header {

        align-items:
          flex-start;

        flex-direction:
          column;

        gap:
          4px;
      }

  

     }


    /* =====================================================
       REDUCED MOTION
    ===================================================== */

    body.accessibility-reduced-motion *,
    body.accessibility-reduced-motion *::before,
    body.accessibility-reduced-motion *::after {

      animation:
        none !important;

      transition:
        none !important;

      scroll-behavior:
        auto !important;
    }

  </style>

</head>


<body>


    <!-- =====================================================
     NAVBAR
===================================================== -->

<div id="siteNavbar"></div>

<div id="innerHero"></div>
  <!-- =====================================================
       MAIN
  ===================================================== -->

  <main>

   
   <!-- =====================================================
     NAVIGASI INFORMASI PUBLIK
===================================================== -->

<section class="informasi-navigation">

  <!-- KARTU JENIS INFORMASI -->
  <div class="informasi-type-cards">

    <button
      type="button"
      class="informasi-type-card active"
      data-type="Berkala"
    >
      <span class="informasi-type-icon">📋</span>

      <span class="informasi-type-content">
        <strong>Berkala</strong>
        <small>
          Informasi yang tersedia secara berkala
        </small>
      </span>

      <span class="informasi-type-arrow">›</span>
    </button>


    <button
      type="button"
      class="informasi-type-card"
      data-type="Setiap Saat"
    >
      <span class="informasi-type-icon">📁</span>

      <span class="informasi-type-content">
        <strong>Setiap Saat</strong>
        <small>
          Informasi yang tersedia setiap saat
        </small>
      </span>

      <span class="informasi-type-arrow">›</span>
    </button>


        <button
      type="button"
      class="informasi-type-card"
      data-type="Serta Merta"
    >
      <span class="informasi-type-icon">📢</span>

      <span class="informasi-type-content">
        <strong>Serta Merta</strong>
        <small>
          Informasi yang perlu segera diketahui masyarakat
        </small>
      </span>

      <span class="informasi-type-arrow">›</span>
    </button>


    <!-- INFORMASI BARANG/JASA -->
    <button
  type="button"
  class="informasi-type-card"
  onclick="window.open('informasi-barang-jasa.html', '_blank')"
>
      <span class="informasi-type-icon">📦</span>

      <span class="informasi-type-content">
        <strong>Informasi Barang/Jasa</strong>
        <small>
          Informasi pengadaan barang dan jasa
        </small>
      </span>

      <span class="informasi-type-arrow">›</span>
    </button>

  </div>

  <!-- ===================================================
       PANEL KATEGORI
  =================================================== -->

  <div
    id="kategoriPanel"
    class="kategori-panel"
  >

    <div class="kategori-header">

      <div>
        <span class="kategori-eyebrow">
          INFORMASI PUBLIK
        </span>

        <h2 id="kategoriTitle">
          Informasi Berkala
        </h2>

        <p id="kategoriDescription">
          Pilih jenis informasi untuk melihat dokumen
          yang tersedia.
        </p>
      </div>

    </div>


    <div
      id="kategoriList"
      class="kategori-list"
    ></div>

  </div>


  <!-- ===================================================
       PANEL SERTA MERTA
  =================================================== -->

 <div
  id="sertaMertaPanel"
  class="serta-merta-panel"
  style="display:none;"
>

  <div class="dokumen-panel-header">

    <div class="dokumen-panel-title">

      <span class="kategori-eyebrow">
        INFORMASI PUBLIK
      </span>

      <h2>
        Informasi Serta Merta
      </h2>

    </div>

  </div>


  <div class="dokumen-toolbar">

    <div class="search-wrapper">

      <span class="search-icon">
        🔎
      </span>

      <input
        type="text"
        id="searchInputSertaMerta"
        placeholder="Cari informasi..."
        autocomplete="off"
      >

    </div>


    <div class="informasi-sort">

      <label for="informasiSortSertaMerta">
        Urutkan:
      </label>

      <select id="informasiSortSertaMerta">

        <option value="terbaru">
          Terbaru → Terlama
        </option>

        <option value="terlama">
          Terlama → Terbaru
        </option>

      </select>

    </div>

  </div>

</div>


  <!-- ===================================================
       PANEL DOKUMEN
  =================================================== -->

  <div
    id="dokumenPanel"
    class="dokumen-panel"
    style="display:none;"
  >

    <div class="dokumen-panel-header">

      <button
        type="button"
        id="backToKategori"
        class="back-button"
      >
        ← Kembali
      </button>

      <div class="dokumen-panel-title">

        <span class="kategori-eyebrow">
          INFORMASI PUBLIK
        </span>

        <h2 id="dokumenTitle">
          -
        </h2>

      </div>

    </div>


    <!-- PENCARIAN DOKUMEN -->

    <div class="dokumen-toolbar">

      <div class="search-wrapper">

        <span class="search-icon">
          🔎
        </span>

        <input
          type="text"
          id="searchInput"
          placeholder="Cari dokumen..."
          autocomplete="off"
        >

      </div>


      <div class="informasi-sort">

        <label for="informasiSort">
          Urutkan:
        </label>

        <select id="informasiSort">

          <option value="terbaru">
            Terbaru → Terlama
          </option>

          <option value="terlama">
            Terlama → Terbaru
          </option>

        </select>

      </div>

    </div>
  </div>

  <div class="result-header" id="resultHeader">
    <h2>Daftar Informasi</h2>
    <span id="resultCount"></span>
  </div>

</section>

    <!-- ERROR -->

    <div id="error"></div>


    <!-- LOADING -->

    <div id="loading">

      <div class="spinner"></div>

      <div>
        Memuat informasi publik...
      </div>

    </div>


    <!-- DATA -->

    <div
      id="dataList"
      class="data-list"
      style="display:none;"
    ></div>


    <!-- PAGINATION -->

    <div
      id="pagination"
      class="pagination"
    ></div>


  </main>

<div id="siteFooter"></div>

<div id="accessibility"></div>
  
  <script src="layout.js"></script>
<script>

  /* =====================================================
     API
  ===================================================== */

  const API_URL =
    'https://script.google.com/macros/s/AKfycby74M5l9jbsxZOHMq9_svivqRHK9xbK-Ms-iNfSmiggTlUjdnmQbfMC2OeuRVs3M2zT/exec';


  /* =====================================================
     STATE
  ===================================================== */

  let allData = [];

  let activeType = 'Berkala';

  let activeCategory = '';

  let currentPage = 1;

  let pageSize = 10;


  /* =====================================================
     KONFIGURASI KATEGORI INFORMASI PUBLIK
  ===================================================== */

  const kategoriInformasiPublik = {

    'Berkala': [

      'Laporan Kegiatan',

      'Laporan Kinerja',

      'Laporan Keuangan',

      'SAKIP',

      'Renstra',

      'DIPA',

      'Program Kerja',

      'LHKPN Kakanwil',

      'Laporan PPID',

      'Laporan BMN',

      'Informasi Kepegawaian',

      'Publikasi Statistik'

    ],

    'Setiap Saat': [

      'Informasi Kelembagaan',

      'Daftar Informasi Publik',

      'Daftar Informasi Dikecualikan'

    ]

  };


  /* =====================================================
     STATE NAVIGASI
  ===================================================== */

  let selectedType = 'Berkala';

  let selectedCategory = '';


  /* =====================================================
     ELEMENT
  ===================================================== */

  const dataList =
    document.getElementById('dataList');

  const loading =
    document.getElementById('loading');

  const errorBox =
    document.getElementById('error');

  const resultHeader =
    document.getElementById('resultHeader');

  const resultCount =
    document.getElementById('resultCount');

  const searchInput =
    document.getElementById('searchInput');

  const searchInputSertaMerta =
    document.getElementById('searchInputSertaMerta');

  const pagination =
    document.getElementById('pagination');

  const informasiSort =
    document.getElementById('informasiSort');

  const informasiSortSertaMerta =
    document.getElementById(
      'informasiSortSertaMerta'
    );


  /* =====================================================
     ELEMENT NAVIGASI
  ===================================================== */

  const typeCards =
    document.querySelectorAll(
      '.informasi-type-card'
    );

  const kategoriPanel =
    document.getElementById(
      'kategoriPanel'
    );

  const kategoriTitle =
    document.getElementById(
      'kategoriTitle'
    );

  const kategoriDescription =
    document.getElementById(
      'kategoriDescription'
    );

  const kategoriList =
    document.getElementById(
      'kategoriList'
    );

  const sertaMertaPanel =
    document.getElementById(
      'sertaMertaPanel'
    );

  const dokumenPanel =
    document.getElementById(
      'dokumenPanel'
    );

  const dokumenTitle =
    document.getElementById(
      'dokumenTitle'
    );

  const backToKategori =
    document.getElementById(
      'backToKategori'
    );


  /* =====================================================
     LOAD DATA
  ===================================================== */

  async function loadInformasiPublik() {

    try {

      loading.style.display =
        'block';

      dataList.style.display =
        'none';

      pagination.innerHTML =
        '';

      errorBox.style.display =
        'none';

      if (resultHeader) {
        resultHeader.style.display =
          'none';
      }


      const [
        informasiResponse,
        dokumenResponse
      ] = await Promise.all([

        fetch(
          API_URL +
          '?action=informasi'
        ),

        fetch(
          API_URL +
          '?action=dokumen'
        )

      ]);


      if (
        !informasiResponse.ok
      ) {

        throw new Error(
          'HTTP Error Informasi: ' +
          informasiResponse.status
        );

      }


      if (
        !dokumenResponse.ok
      ) {

        throw new Error(
          'HTTP Error Dokumen: ' +
          dokumenResponse.status
        );

      }


      const [
        informasiResult,
        dokumenResult
      ] = await Promise.all([

        informasiResponse.json(),

        dokumenResponse.json()

      ]);


      if (
        !informasiResult.success
      ) {

        throw new Error(
          informasiResult.message ||
          'Data informasi gagal dimuat.'
        );

      }


      if (
        !dokumenResult.success
      ) {

        throw new Error(
          dokumenResult.message ||
          'Data dokumen gagal dimuat.'
        );

      }


      const informasiData =
        Array.isArray(
          informasiResult.data
        )
          ? informasiResult.data
          : [];


      const dokumenData =
        Array.isArray(
          dokumenResult.data
        )
          ? dokumenResult.data
          : [];


      /* =================================================
         MASTER DOKUMEN MAP
      ================================================= */

      const dokumenMap = {};


      dokumenData.forEach(
        function(dokumen) {

          const informasiId =
            String(
              dokumen.informasi_id ||
              ''
            ).trim();


          if (!informasiId) {
            return;
          }


          if (
            !dokumenMap[
              informasiId
            ]
          ) {

            dokumenMap[
              informasiId
            ] = [];

          }


          if (
            String(
              dokumen.status || ''
            ).toLowerCase()
            === 'published'
          ) {

            dokumenMap[
              informasiId
            ].push(
              dokumen
            );

          }

        }
      );


      /* =================================================
         GABUNG INFORMASI + DOKUMEN
      ================================================= */

      allData =
        informasiData
          .filter(
            function(row) {

              return String(
                row.status || ''
              ).toLowerCase()
              === 'published';

            }
          )
          .map(
            function(row) {

              const id =
                String(
                  row.id || ''
                ).trim();


              return {

                ...row,

                dokumen:
                  dokumenMap[id] ||
                  []

              };

            }
          );


      loading.style.display =
        'none';

      dataList.style.display =
        'none';

      pagination.innerHTML =
        '';

      currentPage = 1;


      /* =================================================
         TAMPILKAN DEFAULT
      ================================================= */

      showInformasiType(
        'Berkala'
      );


    } catch (error) {

      console.error(
        'LOAD INFORMASI ERROR:',
        error
      );


      loading.style.display =
        'none';

      dataList.style.display =
        'none';

      pagination.innerHTML =
        '';


      if (resultHeader) {
        resultHeader.style.display =
          'none';
      }


      errorBox.style.display =
        'block';


      errorBox.textContent =
        'Gagal memuat informasi publik: ' +
        error.message;


      if (resultCount) {
        resultCount.textContent =
          'Data tidak tersedia';
      }

    }

  }


  /* =====================================================
     EVENT KARTU JENIS INFORMASI
  ===================================================== */

  typeCards.forEach(
    function(card) {

      card.addEventListener(
        'click',
        function() {

          const type =
  card.dataset.type;



showInformasiType(
  type
          );

        }
      );

    }
  );


  /* =====================================================
     TAMPILKAN JENIS INFORMASI
  ===================================================== */

  function showInformasiType(
    type
  ) {

    selectedType =
      type;

    selectedCategory =
      '';

    activeType =
      type;

    activeCategory =
      '';

    currentPage =
      1;


    /* =================================================
       UPDATE ACTIVE CARD
    ================================================= */

    typeCards.forEach(
      function(card) {

        if (
          card.dataset.type ===
          type
        ) {

          card.classList.add(
            'active'
          );

        } else {

          card.classList.remove(
            'active'
          );

        }

      }
    );


    /* =================================================
       SERTA MERTA
    ================================================= */

    if (
      type ===
      'Serta Merta'
    ) {

      kategoriPanel.style.display =
        'none';

      dokumenPanel.style.display =
        'none';

      sertaMertaPanel.style.display =
        'block';


      showDocumentResult();


      if (
        searchInputSertaMerta
      ) {

        searchInputSertaMerta.value =
          '';

      }


      if (
        informasiSortSertaMerta
      ) {

        informasiSortSertaMerta.value =
          'terbaru';

      }


      applyDocumentFilter();


      return;

    }


    /* =================================================
       BERKALA / SETIAP SAAT
    ================================================= */

    sertaMertaPanel.style.display =
      'none';

    dokumenPanel.style.display =
      'none';

    kategoriPanel.style.display =
      'block';


    hideDocumentResult();


    if (searchInput) {

      searchInput.value =
        '';

    }


    if (informasiSort) {

      informasiSort.value =
        'terbaru';

    }


    renderKategori(
      type
    );

  }


  /* =====================================================
     RENDER KATEGORI
  ===================================================== */

  function renderKategori(
    type
  ) {

    if (!kategoriList) {
      return;
    }


    kategoriList.innerHTML =
      '';


    if (kategoriTitle) {

      if (
        type ===
        'Berkala'
      ) {

        kategoriTitle.textContent =
          'Informasi Berkala';

      } else {

        kategoriTitle.textContent =
          'Informasi Setiap Saat';

      }

    }


    if (kategoriDescription) {

      if (
        type ===
        'Berkala'
      ) {

        kategoriDescription.textContent =
          'Pilih kategori informasi berkala yang ingin dilihat.';

      } else {

        kategoriDescription.textContent =
          'Pilih kategori informasi yang tersedia setiap saat.';

      }

    }


    const categories =
      kategoriInformasiPublik[
        type
      ] || [];


    if (!categories.length) {

      kategoriList.innerHTML = `

        <div class="no-data">

          <div class="no-data-icon">
            📂
          </div>

          <strong>
            Kategori belum tersedia
          </strong>

        </div>

      `;

      return;

    }


    categories.forEach(
      function(category) {

        const button =
          document.createElement(
            'button'
          );


        button.type =
          'button';

        button.className =
          'kategori-item';

        button.textContent =
          category;


        button.addEventListener(
          'click',
          function() {

            openCategory(
              type,
              category
            );

          }
        );


        kategoriList.appendChild(
          button
        );

      }
    );

  }


  /* =====================================================
     BUKA KATEGORI
  ===================================================== */

  function openCategory(
    type,
    category
  ) {

    selectedType =
      type;

    selectedCategory =
      category;

    activeType =
      type;

    activeCategory =
      category;

    currentPage =
      1;


    kategoriPanel.style.display =
      'none';

    sertaMertaPanel.style.display =
      'none';

    dokumenPanel.style.display =
      'block';


    if (dokumenTitle) {

      dokumenTitle.textContent =
        category;

    }


    if (searchInput) {

      searchInput.value =
        '';

    }


    if (informasiSort) {

      informasiSort.value =
        'terbaru';

    }


    showDocumentResult();

    applyDocumentFilter();

  }


  /* =====================================================
     KEMBALI KE KATEGORI
  ===================================================== */

  if (backToKategori) {

    backToKategori.addEventListener(
      'click',
      function() {

        currentPage =
          1;

        activeCategory =
          '';

        selectedCategory =
          '';

        hideDocumentResult();

        showInformasiType(
          activeType
        );

      }
    );

  }


  /* =====================================================
     TAMPILKAN HASIL
  ===================================================== */

  function showDocumentResult() {

    if (resultHeader) {

      resultHeader.style.display =
        'flex';

    }

    if (dataList) {

      dataList.style.display =
        'block';

    }

  }


  /* =====================================================
     SEMBUNYIKAN HASIL
  ===================================================== */

  function hideDocumentResult() {

    if (resultHeader) {

      resultHeader.style.display =
        'none';

    }

    if (dataList) {

      dataList.style.display =
        'none';

    }

    if (pagination) {

      pagination.innerHTML =
        '';

    }

  }


  /* =====================================================
     FILTER DOKUMEN
  ===================================================== */

  function applyDocumentFilter() {


    /* =================================================
       SERTA MERTA
    ================================================= */

    if (
      activeType ===
      'Serta Merta'
    ) {

      const searchTerm =
        (
          searchInputSertaMerta
            ? searchInputSertaMerta.value
            : ''
        )
          .toLowerCase()
          .trim();


      let filtered =
        allData.filter(
          function(row) {

            const rowType =
              String(
                row.jenis || ''
              )
                .trim()
                .toLowerCase();


            if (
              rowType !==
              'serta merta'
            ) {

              return false;

            }


            if (!searchTerm) {

              return true;

            }


            const searchableText = [

              row.judul,

              row.jenis,

              row.tahun,

              row.tanggal_update,

              row.status

            ]
              .map(
                function(value) {

                  return String(
                    value || ''
                  )
                    .toLowerCase();

                }
              )
              .join(' ');


            return searchableText.includes(
              searchTerm
            );

          }
        );


      /* ===============================================
         SORTING SERTA MERTA
      =============================================== */

      const sortValue =
        informasiSortSertaMerta
          ? informasiSortSertaMerta.value
          : 'terbaru';


      filtered.sort(
        function(a, b) {

          const dateA =
            new Date(
              a.tanggal_update || 0
            ).getTime();


          const dateB =
            new Date(
              b.tanggal_update || 0
            ).getTime();


          if (
            sortValue ===
            'terlama'
          ) {

            return dateA -
              dateB;

          }


          return dateB -
            dateA;

        }
      );


      renderData(
        filtered
      );

      return;

    }


    /* =================================================
       BELUM MEMILIH KATEGORI
    ================================================= */

    if (!activeCategory) {

      renderData([]);

      return;

    }


    const searchTerm =
      (
        searchInput
          ? searchInput.value
          : ''
      )
        .toLowerCase()
        .trim();


    /* =================================================
       FILTER JENIS + KATEGORI
    ================================================= */

    let filtered =
      allData.filter(
        function(row) {

          const rowType =
            String(
              row.jenis || ''
            )
              .trim()
              .toLowerCase();


          const rowCategory =
            String(
              row.kategori || ''
            )
              .trim()
              .toLowerCase();


          const targetType =
            String(
              activeType || ''
            )
              .trim()
              .toLowerCase();


          const targetCategory =
            String(
              activeCategory || ''
            )
              .trim()
              .toLowerCase();


          if (
            rowType !==
            targetType
          ) {

            return false;

          }


          if (
            rowCategory !==
            targetCategory
          ) {

            return false;

          }


          /* ===========================================
             PENCARIAN
          =========================================== */

          if (!searchTerm) {

            return true;

          }


          const searchableText = [

            row.judul,

            row.kategori,

            row.jenis,

            row.tahun,

            row.status

          ]
            .map(
              function(value) {

                return String(
                  value || ''
                )
                  .toLowerCase();

              }
            )
            .join(' ');


          return searchableText.includes(
            searchTerm
          );

        }
      );


    /* =================================================
       SORTING BERKALA / SETIAP SAAT
    ================================================= */

    const sortValue =
      informasiSort
        ? informasiSort.value
        : 'terbaru';


    filtered.sort(
      function(a, b) {

        const yearA =
          Number(
            a.tahun || 0
          );


        const yearB =
          Number(
            b.tahun || 0
          );


        if (
          sortValue ===
          'terlama'
        ) {

          return yearA -
            yearB;

        }


        return yearB -
          yearA;

      }
    );


    renderData(
      filtered
    );

  }


  /* =====================================================
     EVENT SEARCH BERKALA / SETIAP SAAT
  ===================================================== */

  if (searchInput) {

    searchInput.addEventListener(
      'input',
      function() {

        if (
          !activeCategory
        ) {

          return;

        }

        currentPage =
          1;

        applyDocumentFilter();

      }
    );

  }


  /* =====================================================
     EVENT SORT BERKALA / SETIAP SAAT
  ===================================================== */

  if (informasiSort) {

    informasiSort.addEventListener(
      'change',
      function() {

        if (
          !activeCategory
        ) {

          return;

        }

        currentPage =
          1;

        applyDocumentFilter();

      }
    );

  }


  /* =====================================================
     EVENT SEARCH SERTA MERTA
  ===================================================== */

  if (
    searchInputSertaMerta
  ) {

    searchInputSertaMerta.addEventListener(
      'input',
      function() {

        if (
          activeType !==
          'Serta Merta'
        ) {

          return;

        }

        currentPage =
          1;

        applyDocumentFilter();

      }
    );

  }


  /* =====================================================
     EVENT SORT SERTA MERTA
  ===================================================== */

  if (
    informasiSortSertaMerta
  ) {

    informasiSortSertaMerta.addEventListener(
      'change',
      function() {

        if (
          activeType !==
          'Serta Merta'
        ) {

          return;

        }

        currentPage =
          1;

        applyDocumentFilter();

      }
    );

  }


  /* =====================================================
     RENDER DATA - TABEL
  ===================================================== */

  function renderData(
    data
  ) {

    dataList.innerHTML =
      '';

    pagination.innerHTML =
      '';


    resultCount.textContent =
      data.length +
      ' informasi tersedia';


    /* =================================================
       DATA KOSONG
    ================================================= */

    if (!data.length) {

      dataList.innerHTML = `

        <div class="no-data">

          <div class="no-data-icon">
            🔎
          </div>

          <strong>
            Informasi tidak ditemukan
          </strong>

          <span>
            Coba gunakan kata kunci pencarian
            yang berbeda.
          </span>

        </div>

      `;

      return;

    }


    /* =================================================
       PAGINATION
    ================================================= */

    const totalPages =
      Math.ceil(
        data.length /
        pageSize
      );


    if (
      currentPage >
      totalPages
    ) {

      currentPage =
        totalPages;

    }


    const start =
      (
        currentPage -
        1
      ) *
      pageSize;


    const end =
      start +
      pageSize;


    const pageData =
      data.slice(
        start,
        end
      );


    /* =================================================
       TABLE
    ================================================= */

    const table =
      document.createElement(
        'table'
      );


    table.className =
      'informasi-table';


    table.innerHTML = `

      <thead>

        <tr>

          <th>No.</th>

          <th>
            Informasi Publik
          </th>

          <th>
            Jenis
          </th>

          <th>
            Tahun
          </th>

          <th>
            Diperbarui
          </th>

          <th>
            Dokumen
          </th>

        </tr>

      </thead>

      <tbody></tbody>

    `;


    const tbody =
      table.querySelector(
        'tbody'
      );


    /* =================================================
       TABLE ROW
    ================================================= */

    pageData.forEach(
      function(row, index) {

        const tr =
          document.createElement(
            'tr'
          );


        const nomor =
          start +
          index +
          1;


        const judul =
          row.judul ||
          'Tanpa Judul';


        const jenis =
          row.jenis ||
          '';


        const tahun =
          row.tahun ||
          '';


        const tanggal =
          formatTanggal(
            row.tanggal_update
          );


        const dokumen =
          Array.isArray(
            row.dokumen
          )
            ? row.dokumen
            : [];


        let documentHTML =
          '';


        /* =============================================
           DOKUMEN DARI MASTER
        ============================================= */

        if (
          dokumen.length >
          0
        ) {

          documentHTML =
            dokumen
              .map(
                function(doc) {

                  const url =
                    doc.url_dokumen ||
                    '';


                  const namaDokumen =
                    doc.nama_dokumen ||
                    'Lihat Dokumen';


                  if (!url) {

                    return '';

                  }


                  return `

                    <a
                      href="${escapeAttribute(url)}"
                      class="table-document-button"
                      target="_blank"
                      rel="noopener noreferrer"
                      title="${escapeHTML(
                        namaDokumen
                      )}"
                    >
                      Lihat
                    </a>

                  `;

                }
              )
              .join('');

        }


        /* =============================================
           FALLBACK URL DOKUMEN
        ============================================= */

        if (
          !documentHTML &&
          row.url_dokumen
        ) {

          documentHTML = `

            <a
              href="${escapeAttribute(
                row.url_dokumen
              )}"
              class="table-document-button"
              target="_blank"
              rel="noopener noreferrer"
              title="Lihat Dokumen"
            >
              Lihat
            </a>

          `;

        }


        /* =============================================
           DOKUMEN TIDAK TERSEDIA
        ============================================= */

        if (!documentHTML) {

          documentHTML = `

            <span class="table-document-empty">
              Belum tersedia
            </span>

          `;

        }


        /* =============================================
           ROW
        ============================================= */

        tr.innerHTML = `

          <td>

            <span class="table-number">
              ${nomor}
            </span>

          </td>


          <td>

            <div class="table-title">
              ${escapeHTML(
                judul
              )}
            </div>

          </td>


          <td>

            ${
              jenis
                ? `
                  <span class="table-badge">
                    ${escapeHTML(
                      jenis
                    )}
                  </span>
                `
                : `
                  <span class="table-badge empty">
                    -
                  </span>
                `
            }

          </td>


          <td>

            <span class="table-year">

              ${
                tahun
                  ? escapeHTML(
                      tahun
                    )
                  : '-'
              }

            </span>

          </td>


          <td>

            <span class="table-date">

              ${
                tanggal
                  ? escapeHTML(
                      tanggal
                    )
                  : '-'
              }

            </span>

          </td>


          <td>

            <div class="table-documents">

              ${documentHTML}

            </div>

          </td>

        `;


        tbody.appendChild(
          tr
        );

      }
    );


    /* =================================================
       MASUKKAN TABLE
    ================================================= */

    dataList.appendChild(
      table
    );


    /* =================================================
       PAGINATION
    ================================================= */

    renderPagination(
      data.length,
      totalPages
    );

  }


  /* =====================================================
     PAGINATION
  ===================================================== */

  function renderPagination(
    totalItems,
    totalPages
  ) {

    pagination.innerHTML =
      '';


    if (
      totalItems <=
      pageSize
    ) {

      return;

    }


    const info =
      document.createElement(
        'div'
      );


    info.className =
      'pagination-info';


    const start =
      (
        currentPage -
        1
      ) *
      pageSize +
      1;


    const end =
      Math.min(
        currentPage *
          pageSize,
        totalItems
      );


    info.textContent =
      'Menampilkan ' +
      start +
      '–' +
      end +
      ' dari ' +
      totalItems +
      ' informasi';


    pagination.appendChild(
      info
    );


    /* =================================================
       PREVIOUS
    ================================================= */

    const prev =
      document.createElement(
        'button'
      );


    prev.type =
      'button';

    prev.textContent =
      '‹';

    prev.disabled =
      currentPage ===
      1;


    prev.addEventListener(
      'click',
      function() {

        if (
          currentPage >
          1
        ) {

          currentPage--;

          applyDocumentFilter();

          window.scrollTo({

            top: 0,

            behavior: 'smooth'

          });

        }

      }
    );


    pagination.appendChild(
      prev
    );


    /* =================================================
       NOMOR HALAMAN
    ================================================= */

    const maxButtons =
      5;


    let startPage =
      Math.max(
        1,
        currentPage -
          Math.floor(
            maxButtons /
            2
          )
      );


    let endPage =
      Math.min(
        totalPages,
        startPage +
          maxButtons -
          1
      );


    if (
      endPage -
      startPage +
      1 <
      maxButtons
    ) {

      startPage =
        Math.max(
          1,
          endPage -
            maxButtons +
            1
        );

    }


    for (
      let page =
        startPage;

      page <=
      endPage;

      page++
    ) {

      const button =
        document.createElement(
          'button'
        );


      button.type =
        'button';


      button.textContent =
        page;


      if (
        page ===
        currentPage
      ) {

        button.classList.add(
          'active'
        );

      }


      button.addEventListener(
        'click',
        function() {

          currentPage =
            page;

          applyDocumentFilter();

          window.scrollTo({

            top: 0,

            behavior: 'smooth'

          });

        }
      );


      pagination.appendChild(
        button
      );

    }


    /* =================================================
       NEXT
    ================================================= */

    const next =
      document.createElement(
        'button'
      );


    next.type =
      'button';

    next.textContent =
      '›';

    next.disabled =
      currentPage ===
      totalPages;


    next.addEventListener(
      'click',
      function() {

        if (
          currentPage <
          totalPages
        ) {

          currentPage++;

          applyDocumentFilter();

          window.scrollTo({

            top: 0,

            behavior: 'smooth'

          });

        }

      }
    );


    pagination.appendChild(
      next
    );

  }


  /* =====================================================
     FORMAT TANGGAL
  ===================================================== */

  function formatTanggal(
    value
  ) {

    if (!value) {

      return '';

    }


    const date =
      new Date(
        value
      );


    if (
      isNaN(
        date.getTime()
      )
    ) {

      return String(
        value
      );

    }


    return date.toLocaleDateString(
      'id-ID',
      {

        day:
          '2-digit',

        month:
          'short',

        year:
          'numeric'

      }
    );

  }


  /* =====================================================
     SECURITY
  ===================================================== */

  function escapeHTML(
    value
  ) {

    return String(
      value ?? ''
    )

      .replace(
        /&/g,
        '&amp;'
      )

      .replace(
        /</g,
        '&lt;'
      )

      .replace(
        />/g,
        '&gt;'
      )

      .replace(
        /"/g,
        '&quot;'
      )

      .replace(
        /'/g,
        '&#039;'
      );

  }


  function escapeAttribute(
    value
  ) {

    return String(
      value ?? ''
    )

      .replace(
        /"/g,
        '&quot;'
      )

      .replace(
        /'/g,
        '&#039;'
      );

  }


  /* =====================================================
     START
  ===================================================== */

  loadInformasiPublik();

</script>
