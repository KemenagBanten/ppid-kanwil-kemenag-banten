  <script>


    /* =====================================================
       API
    ===================================================== */

    const API_URL =
      'https://script.google.com/macros/s/AKfycby74M5l9jbsxZOHMq9_svivqRHK9xbK-Ms-iNfSmiggTlUjdnmQbfMC2OeuRVs3M2zT/exec';


    /* =====================================================
       STATE
    ===================================================== */

    let allData = [];

    let activeFilter = 'all';

    let currentPage = 1;

    const pageSize = 10;


    /* =====================================================
       ELEMENT
    ===================================================== */

    const dataList =
      document.getElementById('dataList');

    const loading =
      document.getElementById('loading');

    const errorBox =
      document.getElementById('error');

    const resultCount =
      document.getElementById('resultCount');

    const searchInput =
      document.getElementById('searchInput');

    const pagination =
      document.getElementById('pagination');

    const informasiSort =
  document.getElementById('informasiSort');


       /* =====================================================
       LOAD DATA
    ===================================================== */

    async function loadInformasiPublik() {

      try {

        loading.style.display =
          'block';

        dataList.style.display =
          'none';

        errorBox.style.display =
          'none';


        const [
          informasiResponse,
          dokumenResponse
        ] = await Promise.all([

          fetch(
            API_URL +
            '?action=informasi'
          ),

          fetch(
            API_URL +
            '?action=dokumen'
          )

        ]);


        if (
          !informasiResponse.ok
        ) {

          throw new Error(
            'HTTP Error Informasi: ' +
            informasiResponse.status
          );

        }


        if (
          !dokumenResponse.ok
        ) {

          throw new Error(
            'HTTP Error Dokumen: ' +
            dokumenResponse.status
          );

        }


        const [
          informasiResult,
          dokumenResult
        ] = await Promise.all([

          informasiResponse.json(),

          dokumenResponse.json()

        ]);


        if (
          !informasiResult.success
        ) {

          throw new Error(
            informasiResult.message ||
            'Data informasi gagal dimuat.'
          );

        }


        if (
          !dokumenResult.success
        ) {

          throw new Error(
            dokumenResult.message ||
            'Data dokumen gagal dimuat.'
          );

        }


        const informasiData =
          Array.isArray(
            informasiResult.data
          )
            ? informasiResult.data
            : [];


        const dokumenData =
          Array.isArray(
            dokumenResult.data
          )
            ? dokumenResult.data
            : [];


        /* =================================================
           MASTER DOKUMEN MAP
        ================================================= */

        const dokumenMap = {};


        dokumenData.forEach(
          function(dokumen) {

            const informasiId =
              String(
                dokumen.informasi_id ||
                ''
              ).trim();


            if (!informasiId) return;


            if (
              !dokumenMap[
                informasiId
              ]
            ) {

              dokumenMap[
                informasiId
              ] = [];

            }


            if (
              String(
                dokumen.status || ''
              ).toLowerCase()
              === 'published'
            ) {

              dokumenMap[
                informasiId
              ].push(
                dokumen
              );

            }

          }
        );


        /* =================================================
           GABUNG INFORMASI + DOKUMEN
        ================================================= */

        allData =
          informasiData
            .filter(
              function(row) {

                return String(
                  row.status || ''
                ).toLowerCase()
                === 'published';

              }
            )
            .map(
              function(row) {

                const id =
                  String(
                    row.id || ''
                  ).trim();


                return {

                  ...row,

                  dokumen:
                    dokumenMap[id] ||
                    []

                };

              }
            );


        loading.style.display =
          'none';

        dataList.style.display =
          'flex';


        currentPage = 1;

        applyFilter();


      } catch (error) {

        console.error(
          'LOAD INFORMASI ERROR:',
          error
        );


        loading.style.display =
          'none';

        dataList.style.display =
          'none';


        errorBox.style.display =
          'block';


        errorBox.textContent =
          'Gagal memuat informasi publik: ' +
          error.message;


        resultCount.textContent =
          'Data tidak tersedia';

      }

    }


    /* =====================================================
       FILTER BUTTON
    ===================================================== */

    document
      .querySelectorAll(
        '.filter-btn'
      )
      .forEach(
        function(button) {

          button.addEventListener(
            'click',
            function() {

              document
                .querySelectorAll(
                  '.filter-btn'
                )
                .forEach(
                  function(btn) {

                    btn.classList.remove(
                      'active'
                    );

                  }
                );


              this.classList.add(
                'active'
              );


              activeFilter =
                this.dataset.filter;


              currentPage = 1;

              applyFilter();

            }
          );

        }
      );


    /* =====================================================
       SEARCH
    ===================================================== */

    searchInput.addEventListener(
      'input',
      function() {

        currentPage = 1;

        applyFilter();

      }
    );


    /* =====================================================
       APPLY FILTER
    ===================================================== */

    function applyFilter() {

      const keyword =
        searchInput.value
          .toLowerCase()
          .trim();


      const filtered =
        allData.filter(
          function(row) {

            const jenis =
              String(
                row.jenis ||
                row.jenis_informasi ||
                ''
              );


            const searchText = [

              row.id,

              row.judul,

              row.jenis,

              row.jenis_informasi,

              row.kategori,

              row.ringkasan,

              row.unit,

              row.pejabat_unit,

              row.tahun,

              row.status

            ]
              .join(' ')
              .toLowerCase();


            const matchesSearch =
              !keyword ||
              searchText.includes(
                keyword
              );


            const normalizedJenis =
              jenis
                .toLowerCase()
                .replace(
                  /\s+/g,
                  ' '
                )
                .trim();


            const normalizedFilter =
              activeFilter
                .toLowerCase()
                .replace(
                  /\s+/g,
                  ' '
                )
                .trim();


            const matchesFilter =
              activeFilter === 'all' ||
              normalizedJenis ===
                normalizedFilter;


            return (
              matchesSearch &&
              matchesFilter
            );

          }
        );
filteredInformasi.sort(function(a, b) {

  const tahunA = parseInt(
    String(a.tahun || '').match(/\d{4}/)?.[0] || '0',
    10
  );

  const tahunB = parseInt(
    String(b.tahun || '').match(/\d{4}/)?.[0] || '0',
    10
  );

  if (informasiSort.value === 'terlama') {
    return tahunA - tahunB;
  }

  return tahunB - tahunA;
});

      informasiSort.addEventListener(
  'change',
  function() {
    applyInformasiFilter();
  }
);

      renderData(
        filtered
      );

    }

/* =====================================================
   RENDER DATA - TABEL
===================================================== */

function renderData(data) {

  dataList.innerHTML = '';
  pagination.innerHTML = '';

  resultCount.textContent =
    data.length + ' informasi tersedia';


  /* ===================================================
     DATA KOSONG
  =================================================== */

  if (!data.length) {

    dataList.innerHTML = `

      <div class="no-data">

        <div class="no-data-icon">
          🔎
        </div>

        <strong>
          Informasi tidak ditemukan
        </strong>

        <span>
          Coba gunakan kata kunci pencarian
          atau kategori yang berbeda.
        </span>

      </div>

    `;

    return;
  }


  /* ===================================================
     PAGINATION
  =================================================== */

  const totalPages =
    Math.ceil(
      data.length / pageSize
    );


  if (currentPage > totalPages) {

    currentPage =
      totalPages;

  }


  const start =
    (
      currentPage - 1
    ) * pageSize;


  const end =
    start + pageSize;


  const pageData =
    data.slice(
      start,
      end
    );


  /* ===================================================
     TABLE HEADER
  =================================================== */

  const table =
    document.createElement('table');

  table.className =
    'informasi-table';


  table.innerHTML = `

    <thead>

      <tr>

        <th>No.</th>

        <th>Informasi Publik</th>

        <th>Jenis</th>

        <th>Kategori</th>

        <th>Tahun</th>

        <th>Diperbarui</th>

        <th>Dokumen</th>

      </tr>

    </thead>

    <tbody></tbody>

  `;


  const tbody =
    table.querySelector('tbody');


  /* ===================================================
     TABLE ROW
  =================================================== */

  pageData.forEach(
    function(row, index) {

      const tr =
        document.createElement('tr');


      /* ===============================================
         DATA
      =============================================== */

      const nomor =
        start + index + 1;


      const judul =
        row.judul ||
        'Tanpa Judul';


      const jenis =
        row.jenis ||
        row.jenis_informasi ||
        '';


      const kategori =
        row.kategori ||
        '';


      const tahun =
        row.tahun ||
        '';


      const tanggal =
        formatTanggal(
          row.tanggal_update
        );


      /* ===============================================
         MASTER DOKUMEN
      =============================================== */

      const dokumen =
        Array.isArray(row.dokumen)
          ? row.dokumen
          : [];


      let documentHTML =
        '';


      if (dokumen.length > 0) {

        documentHTML =
          dokumen
            .map(
              function(doc) {

                const url =
                  doc.url_dokumen ||
                  '';


                const namaDokumen =
                  doc.nama_dokumen ||
                  'Lihat Dokumen';


                if (!url) {
                  return '';
                }


                return `

                  <a
                    href="${escapeAttribute(url)}"
                    class="table-document-button"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="${escapeHTML(namaDokumen)}"
                  >
                    Lihat
                  </a>

                `;

              }
            )
            .join('');

      }


      /* ===============================================
         FALLBACK URL LAMA
      =============================================== */

      if (
        !documentHTML &&
        row.url_dokumen
      ) {

        documentHTML = `

          <a
            href="${escapeAttribute(
              row.url_dokumen
            )}"
            class="table-document-button"
            target="_blank"
            rel="noopener noreferrer"
            title="Lihat Dokumen"
          >
            Lihat
          </a>

        `;

      }


      /* ===============================================
         DOKUMEN TIDAK TERSEDIA
      =============================================== */

      if (!documentHTML) {

        documentHTML = `

          <span class="table-document-empty">
            Belum tersedia
          </span>

        `;

      }


      /* ===============================================
         ROW
      =============================================== */

      tr.innerHTML = `

        <td>

          <span class="table-number">
            ${nomor}
          </span>

        </td>


        <td>

          <div class="table-title">
            ${escapeHTML(judul)}
          </div>

        </td>


        <td>

          ${
            jenis
              ? `
                <span class="table-badge">
                  ${escapeHTML(jenis)}
                </span>
              `
              : `
                <span class="table-badge empty">
                  -
                </span>
              `
          }

        </td>


        <td>

          <span class="table-category">

            ${
              kategori
                ? escapeHTML(kategori)
                : '-'
            }

          </span>

        </td>


        <td>

          <span class="table-year">

            ${
              tahun
                ? escapeHTML(tahun)
                : '-'
            }

          </span>

        </td>


        <td>

          <span class="table-date">

            ${
              tanggal
                ? escapeHTML(tanggal)
                : '-'
            }

          </span>

        </td>


        <td>

          <div class="table-documents">

            ${documentHTML}

          </div>

        </td>

      `;


      tbody.appendChild(tr);

    }
  );


  /* ===================================================
     MASUKKAN TABLE
  =================================================== */

  dataList.appendChild(table);


  /* ===================================================
     PAGINATION
  =================================================== */

  renderPagination(
    data.length,
    totalPages
  );

}
    /* =====================================================
       PAGINATION
    ===================================================== */

    function renderPagination(
      totalItems,
      totalPages
    ) {

      pagination.innerHTML =
        '';


      if (
        totalItems <=
        pageSize
      ) {

        return;

      }


      const info =
        document.createElement(
          'div'
        );


      info.className =
        'pagination-info';


      const start =
        (
          currentPage -
          1
        ) *
        pageSize +
        1;


      const end =
        Math.min(
          currentPage *
            pageSize,
          totalItems
        );


      info.textContent =
        'Menampilkan ' +
        start +
        '–' +
        end +
        ' dari ' +
        totalItems +
        ' informasi';


      pagination.appendChild(
        info
      );


      const prev =
        document.createElement(
          'button'
        );


      prev.type =
        'button';

      prev.textContent =
        '‹';

      prev.disabled =
        currentPage === 1;


      prev.addEventListener(
        'click',
        function() {

          if (
            currentPage >
            1
          ) {

            currentPage--;

            applyFilter();

            window.scrollTo({
              top: 0,
              behavior: 'smooth'
            });

          }

        }
      );


      pagination.appendChild(
        prev
      );


      const maxButtons =
        5;


      let startPage =
        Math.max(
          1,
          currentPage -
            Math.floor(
              maxButtons / 2
            )
        );


      let endPage =
        Math.min(
          totalPages,
          startPage +
            maxButtons -
            1
        );


      if (
        endPage -
        startPage +
        1 <
        maxButtons
      ) {

        startPage =
          Math.max(
            1,
            endPage -
              maxButtons +
              1
          );

      }


      for (
        let page =
          startPage;
        page <= endPage;
        page++
      ) {

        const button =
          document.createElement(
            'button'
          );


        button.type =
          'button';


        button.textContent =
          page;


        if (
          page ===
          currentPage
        ) {

          button.classList.add(
            'active'
          );

        }


        button.addEventListener(
          'click',
          function() {

            currentPage =
              page;

            applyFilter();

            window.scrollTo({
              top: 0,
              behavior: 'smooth'
            });

          }
        );


        pagination.appendChild(
          button
        );

      }


      const next =
        document.createElement(
          'button'
        );


      next.type =
        'button';

      next.textContent =
        '›';

      next.disabled =
        currentPage ===
        totalPages;


      next.addEventListener(
        'click',
        function() {

          if (
            currentPage <
            totalPages
          ) {

            currentPage++;

            applyFilter();

            window.scrollTo({
              top: 0,
              behavior: 'smooth'
            });

          }

        }
      );


      pagination.appendChild(
        next
      );

    }


    /* =====================================================
       FORMAT TANGGAL
    ===================================================== */

    function formatTanggal(
      value
    ) {

      if (!value) {
        return '';
      }


      const date =
        new Date(value);


      if (
        isNaN(
          date.getTime()
        )
      ) {

        return String(value);

      }


      return date.toLocaleDateString(
        'id-ID',
        {
          day:
            '2-digit',

          month:
            'short',

          year:
            'numeric'
        }
      );

    }


    /* =====================================================
       SECURITY
    ===================================================== */

    function escapeHTML(
      value
    ) {

      return String(
        value ?? ''
      )

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    function escapeAttribute(
      value
    ) {

      return String(
        value ?? ''
      )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    /* =====================================================
       START
    ===================================================== */

    loadInformasiPublik();


  </script>
