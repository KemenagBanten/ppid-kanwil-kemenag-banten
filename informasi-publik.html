  <style>

    /* =====================================================
       MAIN
    ===================================================== */

    main {

      max-width:
        1200px;

      margin:
        auto;

      padding:
        42px 24px 70px;
    }


    /* =====================================================
       TOOLBAR
    ===================================================== */

    .toolbar {

      background:
        #ffffff;

      border:
        1px solid #e3e9e5;

      border-radius:
        16px;

      padding:
        18px;

      box-shadow:
        0 8px 30px rgba(24,51,39,.05);

      margin-bottom:
        30px;
    }


    .search-wrapper {

      position:
        relative;
    }


    .search-icon {

      position:
        absolute;

      left:
        16px;

      top:
        50%;

      transform:
        translateY(-50%);

      color:
        #7a8781;

      font-size:
        17px;

      pointer-events:
        none;
    }


    #searchInput {

      width:
        100%;

      border:
        1px solid #dce4df;

      background:
        #fafcfb;

      border-radius:
        11px;

      padding:
        14px 16px 14px 44px;

      outline:
        none;

      font-size:
        15px;

      color:
        #26352e;

      transition:
        .2s ease;
    }


    #searchInput:focus {

      background:
        #ffffff;

      border-color:
        #198754;

      box-shadow:
        0 0 0 4px rgba(25,135,84,.08);
    }


    /* =====================================================
       CATEGORY FILTER
    ===================================================== */

    .filters {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        8px;

      margin-top:
        14px;
    }


    .filter-btn {

      border:
        1px solid #dce5df;

      background:
        #ffffff;

      color:
        #52615a;

      border-radius:
        30px;

      padding:
        8px 15px;

      cursor:
        pointer;

      font-size:
        13px;

      transition:
        .2s ease;
    }


    .filter-btn:hover {

      border-color:
        #198754;

      color:
        #0f5132;
    }


    .filter-btn.active {

        #0f5132;

      color:
        #ffffff;

      border-color:
        #0f5132;
    }


    /* =====================================================
       RESULT HEADER
    ===================================================== */

    .result-header {

        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:

      margin-bottom:
        12px;

        22px;

      color:
        #26352e;
    }


    #resultCount {

        13px;

      color:
        #738079;

      white-space:
        nowrap;
    }


    /* =====================================================
       ERROR
    ===================================================== */

    #error {

      display:
        none;

      background:
        #fff3f3;

      border:
        1px solid #f0cccc;

      color:
        #9b3030;

      border-radius:
        12px;

      padding:
        15px 18px;

      margin-bottom:
        20px;

      font-size:
        14px;
    }


    /* =====================================================
       LOADING
    ===================================================== */

    #loading {

      background:
        #ffffff;

      border:
        1px solid #e3e9e5;

      border-radius:
        15px;

      padding:
        45px 20px;

      text-align:
        center;

      color:
        #68766f;

      box-shadow:
        0 5px 20px rgba(0,0,0,.03);
    }


    .spinner {

      width:
        30px;

      height:
        30px;

      border:

      border-top-color:
        #198754;

      border-radius:
        50%;

        spin .8s linear infinite;

      margin:

    }


    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }


    /* =====================================================
       LIST DOKUMEN
    ===================================================== */

    .data-list {

      display:
        flex;

      flex-direction:
        column;

      background:
        #ffffff;

      border:
        1px solid #e2e9e5;

      border-radius:
        15px;

      overflow:
        hidden;

      box-shadow:
        0 6px 24px rgba(26,54,41,.045);
    }


    /* =====================================================
       LIST ITEM
    ===================================================== */

    .document-row {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        20px;

      padding:
        19px 21px;

      border-bottom:
        1px solid #edf1ee;

      transition:
        background .18s ease;
    }


    .document-row:last-child {

      border-bottom:
        none;
    }


    .document-row:hover {

      background:
        #fafcfb;
    }


    .document-main {

      min-width:
        0;

      flex:
        1;
    }


    .document-title {

      display:
        flex;

      align-items:
        flex-start;

      gap:
        12px;
    }


    .pdf-icon {

      width:
        40px;

      height:
        40px;

      flex:
        0 0 40px;

      border-radius:
        9px;

      background:
        #edf6f1;

      color:
        #0f5132;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      font-size:
        11px;

      font-weight:
        800;
    }


    .document-name {

      color:
        #263a30;

      font-size:
        15px;

      line-height:
        1.45;

      font-weight:
        650;

        1px;
    }


    .document-meta {

      display:
        flex;

      align-items:
        center;

      flex-wrap:
        wrap;

      gap:

        52px;

    .meta-badge {

      display:
        inline-flex;

      align-items:
        center;

      padding:
        4px 8px;

      border:
        1px solid #e1e9e4;

      border-radius:
        6px;

      background:
        #f5f8f6;

      color:
        #617069;

      font-size:
        11px;
    }


    .meta-badge.primary {

      background:
        #e9f5ef;

      border-color:
        #d4e9dd;

      color:
        #0f5132;

      font-weight:
        600;
    }


    .document-date {

      margin-top:
        5px;

      margin-left:
        52px;

      color:
        #87928d;

      font-size:
        11px;
    }


    .document-actions {

      flex:
        0 0 auto;

      display:
        flex;

      align-items:
        center;

      gap:
        8px;

      flex-wrap:
        wrap;

      justify-content:
        flex-end;
    }


    .document-button {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        6px;

      background:
        #0f5132;

      color:
        #ffffff;

      padding:
        9px 13px;

      border-radius:
        8px;

      font-size:
        12px;

      font-weight:
        600;

      transition:
        .2s ease;

      white-space:
        nowrap;
    }


    .document-button:hover {

      background:
        #146c43;

      transform:
        translateY(-1px);
    }


    .document-button.disabled {

      background:
        #eef1ef;

      color:
        #7b8580;

      cursor:
        default;
    }


    /* =====================================================
       NO DATA
    ===================================================== */

    .no-data {

      width:
        100%;

      background:
        #ffffff;

      padding:
        55px 20px;

      text-align:
        center;

      color:
        #718078;
    }


    .no-data-icon {

      font-size:
        34px;

      margin-bottom:
        10px;
    }


    .no-data strong {

      display:
        block;

      color:
        #435149;

      margin-bottom:
        5px;
    }


    /* =====================================================
       PAGINATION
    ===================================================== */

    .pagination {

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      gap:
        6px;

      margin-top:
        24px;

      flex-wrap:
        wrap;
    }


    .pagination button {

      min-width:
        36px;

      height:
        36px;

      padding:
        0 10px;

      border:
        1px solid #d9e4de;

      border-radius:
        8px;

      background:
        #ffffff;

      color:
        #315244;

      font-size:
        13px;

      font-weight:
        600;

      cursor:
        pointer;

      transition:

    }


    .pagination button:hover {

      background:
        #f1f7f4;

      border-color:
        #b8cfc3;
    }


    .pagination button.active {

      background:
        #1f5a43;

      border-color:

        #ffffff;
    }


    .pagination button:disabled {

      opacity:
        .45;

      cursor:

    }


    .pagination-info {

      width:
        100%;

      text-align:
        center;

      margin-bottom:
        8px;

      color:
        #71847a;

      font-size:
        12px;
    }


   @media (max-width: 680px) {

       main {

        padding:
          30px 18px 55px;
      }


      .result-header {

        align-items:
          flex-start;

        flex-direction:

        gap:
          4px;
      }

     }


    /* =====================================================
       REDUCED MOTION
    ===================================================== */

    body.accessibility-reduced-motion *,

<body>


    <!-- =====================================================

===================================================== -->

<div id="siteNavbar"></div>

<div id="innerHero"></div>
  <!-- =====================================================

  ===================================================== -->

  <main>


    <!-- TOOLBAR -->

    <section class="toolbar">


      <div class="search-wrapper">

        <span class="search-icon">
          🔎
        </span>


        <input
          type="text"
          id="searchInput"
          placeholder="Cari judul, kategori, jenis informasi, atau kata kunci..."

      <!-- FILTER -->

      <div

          type="button"

          Semua
        </button>

          type="button"

        >

          type="button"
          class="filter-btn"

    <!-- RESULT HEADER -->

  <script src="layout.js"></script>
  <!-- =====================================================
       SCRIPT
  ===================================================== -->

  <script>


    /* =====================================================
       API
    ===================================================== */

    const API_URL =
      'https://script.google.com/macros/s/AKfycby74M5l9jbsxZOHMq9_svivqRHK9xbK-Ms-iNfSmiggTlUjdnmQbfMC2OeuRVs3M2zT/exec';


    /* =====================================================
       STATE
    ===================================================== */

    let allData = [];

    let activeFilter = 'all';

    let currentPage = 1;

    const pageSize = 10;


    /* =====================================================
       ELEMENT
    ===================================================== */

    const dataList =
      document.getElementById('dataList');

    const loading =
      document.getElementById('loading');

    const errorBox =
      document.getElementById('error');

    const resultCount =
      document.getElementById('resultCount');

    const searchInput =
      document.getElementById('searchInput');

    const pagination =
      document.getElementById('pagination');


       /* =====================================================
       LOAD DATA
    ===================================================== */

    async function loadInformasiPublik() {

      try {

        loading.style.display =
          'block';

        dataList.style.display =
          'none';

        errorBox.style.display =
          'none';


        const [
          informasiResponse,
          dokumenResponse
        ] = await Promise.all([

          fetch(
            API_URL +
            '?action=informasi'
          ),

          fetch(
            API_URL +
            '?action=dokumen'
          )

        ]);


        if (
          !informasiResponse.ok
        ) {

          throw new Error(
            'HTTP Error Informasi: ' +
            informasiResponse.status
          );

        }


        if (
          !dokumenResponse.ok
        ) {

          throw new Error(
            'HTTP Error Dokumen: ' +
            dokumenResponse.status
          );

        }


        const [
          informasiResult,
          dokumenResult
        ] = await Promise.all([

          informasiResponse.json(),

          dokumenResponse.json()

        ]);


        if (
          !informasiResult.success
        ) {

          throw new Error(
            informasiResult.message ||
            'Data informasi gagal dimuat.'
          );

        }


        if (
          !dokumenResult.success
        ) {

          throw new Error(
            dokumenResult.message ||
            'Data dokumen gagal dimuat.'
          );

        }


        const informasiData =
          Array.isArray(
            informasiResult.data
          )
            ? informasiResult.data
            : [];


        const dokumenData =
          Array.isArray(
            dokumenResult.data
          )
            ? dokumenResult.data
            : [];


        /* =================================================
           MASTER DOKUMEN MAP
        ================================================= */

        const dokumenMap = {};


        dokumenData.forEach(
          function(dokumen) {

            const informasiId =
              String(
                dokumen.informasi_id ||
                ''
              ).trim();


            if (!informasiId) return;


            if (
              !dokumenMap[
                informasiId
              ]
            ) {

              dokumenMap[
                informasiId
              ] = [];

            }


            if (
              String(
                dokumen.status || ''
              ).toLowerCase()
              === 'published'
            ) {

              dokumenMap[
                informasiId
              ].push(
                dokumen
              );

            }

          }
        );


        /* =================================================
           GABUNG INFORMASI + DOKUMEN
        ================================================= */

        allData =
          informasiData
            .filter(
              function(row) {

                return String(
                  row.status || ''
                ).toLowerCase()
                === 'published';

              }
            )
            .map(
              function(row) {

                const id =
                  String(
                    row.id || ''
                  ).trim();


                return {

                  ...row,

                  dokumen:
                    dokumenMap[id] ||
                    []

                };

              }
            );


        loading.style.display =
          'none';

        dataList.style.display =
          'flex';


        currentPage = 1;

        applyFilter();


      } catch (error) {

        console.error(
          'LOAD INFORMASI ERROR:',
          error
        );


        loading.style.display =
          'none';

        dataList.style.display =
          'none';


        errorBox.style.display =
          'block';


        errorBox.textContent =
          'Gagal memuat informasi publik: ' +
          error.message;


        resultCount.textContent =
          'Data tidak tersedia';

      }

    }


    /* =====================================================
       FILTER BUTTON
    ===================================================== */

    document
      .querySelectorAll(
        '.filter-btn'
      )
      .forEach(
        function(button) {

          button.addEventListener(
            'click',
            function() {

              document
                .querySelectorAll(
                  '.filter-btn'
                )
                .forEach(
                  function(btn) {

                    btn.classList.remove(
                      'active'
                    );

                  }
                );


              this.classList.add(
                'active'
              );


              activeFilter =
                this.dataset.filter;


              currentPage = 1;

              applyFilter();

            }
          );

        }
      );


    /* =====================================================
       SEARCH
    ===================================================== */

    searchInput.addEventListener(
      'input',
      function() {

        currentPage = 1;

        applyFilter();

      }
    );


    /* =====================================================
       APPLY FILTER
    ===================================================== */

    function applyFilter() {

      const keyword =
        searchInput.value
          .toLowerCase()
          .trim();


      const filtered =
        allData.filter(
          function(row) {

            const jenis =
              String(
                row.jenis ||
                row.jenis_informasi ||
                ''
              );


            const searchText = [

              row.id,

              row.judul,

              row.jenis,

              row.jenis_informasi,

              row.kategori,

              row.ringkasan,

              row.unit,

              row.pejabat_unit,

              row.tahun,

              row.status

            ]
              .join(' ')
              .toLowerCase();


            const matchesSearch =
              !keyword ||
              searchText.includes(
                keyword
              );


            const normalizedJenis =
              jenis
                .toLowerCase()
                .replace(
                  /\s+/g,
                  ' '
                )
                .trim();


            const normalizedFilter =
              activeFilter
                .toLowerCase()
                .replace(
                  /\s+/g,
                  ' '
                )
                .trim();


            const matchesFilter =
              activeFilter === 'all' ||
              normalizedJenis ===
                normalizedFilter;


            return (
              matchesSearch &&
              matchesFilter
            );

          }
        );


      renderData(
        filtered
      );

    }


    /* =====================================================
       RENDER DATA
    ===================================================== */

    function renderData(data) {

      dataList.innerHTML =
        '';

      pagination.innerHTML =
        '';


      resultCount.textContent =
        data.length +
        ' informasi tersedia';


      if (!data.length) {

        dataList.innerHTML = `

          <div class="no-data">

            <div class="no-data-icon">
              🔎
            </div>

            <strong>
              Informasi tidak ditemukan
            </strong>

            <span>
              Coba gunakan kata kunci pencarian
              atau kategori yang berbeda.
            </span>

          </div>

        `;

        return;

      }


      const totalPages =
        Math.ceil(
          data.length /
          pageSize
        );


      if (
        currentPage >
        totalPages
      ) {

        currentPage =
          totalPages;

      }


      const start =
        (
          currentPage -
          1
        ) *
        pageSize;


      const end =
        start +
        pageSize;


      const pageData =
        data.slice(
          start,
          end
        );


      pageData.forEach(
        function(row) {

          const item =
            document.createElement(
              'article'
            );


          item.className =
            'document-row';


          const judul =
            row.judul ||
            'Tanpa Judul';


          const jenis =
            row.jenis ||
            row.jenis_informasi ||
            '';


          const kategori =
            row.kategori ||
            '';


          const tahun =
            row.tahun ||
            '';


          const tanggal =
            formatTanggal(
              row.tanggal_update
            );


          /* =============================================
             MASTER DOKUMEN
          ============================================= */

          const dokumen =
            Array.isArray(
              row.dokumen
            )
              ? row.dokumen
              : [];


          let documentButtons =
            '';


          if (
            dokumen.length > 0
          ) {

            documentButtons =
              dokumen
                .map(
                  function(doc) {

                    const url =
                      doc.url_dokumen ||
                      '';


                    const namaDokumen =
                      doc.nama_dokumen ||
                      'Lihat Dokumen';


                    if (!url) {
                      return '';
                    }


                    return `

                      <a
                        href="${escapeAttribute(url)}"
                        class="document-button"
                        target="_blank"
                        rel="noopener noreferrer"
                      >
                        ${escapeHTML(
                          namaDokumen
                        )}
                        →
                      </a>

                    `;

                  }
                )
                .join('');

          }


          /* =============================================
             FALLBACK URL LAMA
          ============================================= */

          if (
            !documentButtons &&
            row.url_dokumen
          ) {

            documentButtons = `

              <a
                href="${escapeAttribute(
                  row.url_dokumen
                )}"
                class="document-button"
                target="_blank"
                rel="noopener noreferrer"
              >
                Lihat Dokumen →
              </a>

            `;

          }


          if (
            !documentButtons
          ) {

            documentButtons = `

              <span
                class="document-button disabled"
              >
                Dokumen belum tersedia
              </span>

            `;

          }


          item.innerHTML = `

            <div class="document-main">

              <div class="document-title">

                <div class="pdf-icon">
                  PDF
                </div>

                <div>

                  <div class="document-name">
                    ${escapeHTML(judul)}
                  </div>

                </div>

              </div>


              <div class="document-meta">

                ${
                  jenis
                    ? `
                      <span class="meta-badge primary">
                        ${escapeHTML(jenis)}
                      </span>
                    `
                    : ''
                }


                ${
                  kategori
                    ? `
                      <span class="meta-badge">
                        ${escapeHTML(kategori)}
                      </span>
                    `
                    : ''
                }


                ${
                  tahun
                    ? `
                      <span class="meta-badge">
                        ${escapeHTML(tahun)}
                      </span>
                    `
                    : ''
                }

              </div>


              ${
                tanggal
                  ? `
                    <div class="document-date">
                      Diperbarui ${escapeHTML(tanggal)}
                    </div>
                  `
                  : ''
              }

            </div>


            <div class="document-actions">

              ${documentButtons}

            </div>

          `;


          dataList.appendChild(
            item
          );

        }
      );


      renderPagination(
        data.length,
        totalPages
      );

    }


    /* =====================================================
       PAGINATION
    ===================================================== */

    function renderPagination(
      totalItems,
      totalPages
    ) {

      pagination.innerHTML =
        '';


      if (
        totalItems <=
        pageSize
      ) {

        return;

      }


      const info =
        document.createElement(
          'div'
        );


      info.className =
        'pagination-info';


      const start =
        (
          currentPage -
          1
        ) *
        pageSize +
        1;


      const end =
        Math.min(
          currentPage *
            pageSize,
          totalItems
        );


      info.textContent =
        'Menampilkan ' +
        start +
        '–' +
        end +
        ' dari ' +
        totalItems +
        ' informasi';


      pagination.appendChild(
        info
      );


      const prev =
        document.createElement(
          'button'
        );


      prev.type =
        'button';

      prev.textContent =
        '‹';

      prev.disabled =
        currentPage === 1;


      prev.addEventListener(
        'click',
        function() {

          if (
            currentPage >
            1
          ) {

            currentPage--;

            applyFilter();

            window.scrollTo({
              top: 0,
              behavior: 'smooth'
            });

          }

        }
      );


      pagination.appendChild(
        prev
      );


      const maxButtons =
        5;


      let startPage =
        Math.max(
          1,
          currentPage -
            Math.floor(
              maxButtons / 2
            )
        );


      let endPage =
        Math.min(
          totalPages,
          startPage +
            maxButtons -
            1
        );


      if (
        endPage -
        startPage +
        1 <
        maxButtons
      ) {

        startPage =
          Math.max(
            1,
            endPage -
              maxButtons +
              1
          );

      }


      for (
        let page =
          startPage;
        page <= endPage;
        page++
      ) {

        const button =
          document.createElement(
            'button'
          );


        button.type =
          'button';


        button.textContent =
          page;


        if (
          page ===
          currentPage
        ) {

          button.classList.add(
            'active'
          );

        }


        button.addEventListener(
          'click',
          function() {

            currentPage =
              page;

            applyFilter();

            window.scrollTo({
              top: 0,
              behavior: 'smooth'
            });

          }
        );


        pagination.appendChild(
          button
        );

      }


      const next =
        document.createElement(
          'button'
        );


      next.type =
        'button';

      next.textContent =
        '›';

      next.disabled =
        currentPage ===
        totalPages;


      next.addEventListener(
        'click',
        function() {

          if (
            currentPage <
            totalPages
          ) {

            currentPage++;

            applyFilter();

            window.scrollTo({
              top: 0,
              behavior: 'smooth'
            });

          }

        }
      );


      pagination.appendChild(
        next
      );

    }


    /* =====================================================
       FORMAT TANGGAL
    ===================================================== */

    function formatTanggal(
      value
    ) {

      if (!value) {
        return '';
      }


      const date =
        new Date(value);


      if (
        isNaN(
          date.getTime()
        )
      ) {

        return String(value);

      }


      return date.toLocaleDateString(
        'id-ID',
        {
          day:
            '2-digit',

          month:
            'short',

          year:
            'numeric'
        }
      );

    }


    /* =====================================================
       SECURITY
    ===================================================== */

    function escapeHTML(
      value
    ) {

      return String(
        value ?? ''
      )

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    function escapeAttribute(
      value
    ) {

      return String(
        value ?? ''
      )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    /* =====================================================
       START
    ===================================================== */

    loadInformasiPublik();


  </script>
