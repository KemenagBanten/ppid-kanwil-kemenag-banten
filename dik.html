<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Informasi Dikecualikan — PPID Kanwil Kementerian Agama Provinsi Banten</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .dik-page {
      padding: 60px 0 80px;
    }

    .dik-toolbar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 10px;
    }

    .dik-search-wrapper {
      position: relative;
      width: 100%;
    }

    .dik-search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #7a8781;
      pointer-events: none;
    }

    #dikSearchInput {
      width: 100%;
      height: 44px;
      padding: 0 16px 0 44px;
      box-sizing: border-box;
      border: 1px solid #dfe7e2;
      border-radius: 9px;
      background: #ffffff;
      color: #34433b;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    #dikSearchInput:focus {
      border-color: #0f5132;
      box-shadow: 0 0 0 3px rgba(15, 81, 50, 0.08);
    }

    .dik-result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-top: 36px;
      margin-bottom: 12px;
    }

    .dik-result-header h3 {
      margin: 0;
      font-size: 18px;
      color: #263a30;
    }

    #dikResultCount {
      color: #718078;
      font-size: 12px;
    }

    .dik-data-list {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e9e5;
      border-radius: 15px;
      overflow-x: auto;
      overflow-y: hidden;
      box-shadow: 0 6px 24px rgba(26, 54, 41, 0.045);
    }

    .dik-table {
      width: 100%;
      min-width: 1050px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    .dik-table th {
      background: #0f5132;
      color: #ffffff;
      padding: 14px 12px;
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      border-right: 1px solid rgba(255,255,255,0.10);
    }

    .dik-table th:last-child {
      border-right: none;
    }

    .dik-table th:first-child {
      width: 55px;
      text-align: center;
    }

    .dik-table th:nth-child(2) {
      width: 24%;
    }

    .dik-table th:nth-child(3) {
      width: 25%;
    }

    .dik-table th:nth-child(4) {
      width: 25%;
    }

    .dik-table th:nth-child(5) {
      width: 12%;
    }

    .dik-table th:nth-child(6),
    .dik-table th:nth-child(7) {
      width: 9%;
      text-align: center;
    }

    .dik-table td {
      padding: 15px 12px;
      border-bottom: 1px solid #e8eeeb;
      color: #53615a;
      font-size: 13px;
      line-height: 1.65;
      vertical-align: top;
      background: #ffffff;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .dik-table td:first-child {
      text-align: center;
      color: #718078;
      font-weight: 600;
    }

    .dik-table tr:last-child td {
      border-bottom: none;
    }

    .dik-table tr:hover td {
      background: #fbfdfc;
    }

    .dik-cell-title {
      color: #263a30;
      font-weight: 700;
    }

    .dik-empty {
      padding: 40px 20px;
      text-align: center;
      color: #718078;
      font-size: 13px;
    }

    .dik-loading {
      padding: 40px 20px;
      text-align: center;
      color: #718078;
      font-size: 13px;
    }

    .dik-error {
      display: none;
      margin: 14px 0;
      padding: 14px 16px;
      border: 1px solid #ead6d6;
      border-radius: 9px;
      background: #fff8f8;
      color: #8a4141;
      font-size: 13px;
      line-height: 1.6;
    }

    .dik-pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-top: 18px;
    }

    .dik-page-info {
      color: #718078;
      font-size: 12px;
    }

    .dik-page-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dik-page-btn {
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #dfe7e2;
      border-radius: 8px;
      background: #ffffff;
      color: #53615a;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .dik-page-btn:hover:not(:disabled) {
      border-color: #cbdad1;
      background: #f4f8f5;
      color: #0f5132;
    }

    .dik-page-btn.active {
      border-color: #0f5132;
      background: #0f5132;
      color: #ffffff;
    }

    .dik-page-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    @media (max-width: 680px) {
      .dik-page {
        padding: 30px 18px 55px;
      }

      .dik-result-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

      .dik-pagination {
        align-items: flex-start;
        flex-direction: column;
      }

      .dik-page-buttons {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <div id="siteNavbar"></div>
  <div id="innerHero"></div>

  <main class="dik-page">

    <div class="container">

  

      <section class="dik-toolbar">
        <div class="dik-search-wrapper">
          <span class="dik-search-icon">⌕</span>
          <input
            type="text"
            id="dikSearchInput"
            placeholder="Cari informasi, dasar hukum, konsekuensi, atau kata kunci..."
            autocomplete="off"
          >
        </div>
      </section>

      <div class="dik-result-header">
        <h3>Daftar Informasi Dikecualikan</h3>
        <span id="dikResultCount">Memuat data...</span>
      </div>

      <div id="dikError" class="dik-error"></div>

      <div class="dik-data-list">
        <div id="dikLoading" class="dik-loading">
          Memuat informasi dikecualikan...
        </div>

        <div id="dikTableWrap"></div>
      </div>

      <div class="dik-pagination">
        <div id="dikPageInfo" class="dik-page-info"></div>
        <div id="dikPageButtons" class="dik-page-buttons"></div>
      </div>

    </div>

  </main>

  <div id="siteFooter"></div>
  <div id="accessibility"></div>

  <script src="layout.js"></script>

  <script>
    const DIK_API_URL =
      "https://script.google.com/macros/s/AKfycby74M5l9jbsxZOHMq9_svivqRHK9xbK-Ms-iNfSmiggTlUjdnmQbfMC2OeuRVs3M2zT/exec";

    const DIK_PER_PAGE = 10;

    let dikAllData = [];
    let dikFilteredData = [];
    let dikCurrentPage = 1;

    function dikGetValues(row) {
      if (!row || typeof row !== "object") return [];

      if (Array.isArray(row)) return row;

      return Object.keys(row).map(function (key) {
        return row[key];
      });
    }

    function dikNormalize(value) {
      return String(value ?? "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function dikEscapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function dikShowError(message) {
      const errorBox = document.getElementById("dikError");
      if (!errorBox) return;

      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function dikHideError() {
      const errorBox = document.getElementById("dikError");
      if (errorBox) errorBox.style.display = "none";
    }

    function dikRenderTable() {
  const tableWrap = document.getElementById("dikTableWrap");
  const loading = document.getElementById("dikLoading");

  if (!tableWrap) return;

  if (loading) loading.style.display = "none";

  if (!dikFilteredData.length) {
    tableWrap.innerHTML =
      '<div class="dik-empty">Tidak ada informasi yang sesuai.</div>';

    document.getElementById("dikResultCount").textContent =
      "0 informasi";

    dikRenderPagination();
    return;
  }

  const start = (dikCurrentPage - 1) * DIK_PER_PAGE;

  const pageRows = dikFilteredData.slice(
    start,
    start + DIK_PER_PAGE
  );

  function getField(row, fieldName, fallbackIndex) {
    if (!row) return "";

    // Jika API mengembalikan object berdasarkan nama kolom
    if (
      typeof row === "object" &&
      !Array.isArray(row) &&
      Object.prototype.hasOwnProperty.call(row, fieldName)
    ) {
      return dikNormalize(row[fieldName]);
    }

    // Fallback jika API mengembalikan array
    if (Array.isArray(row)) {
      return dikNormalize(row[fallbackIndex]);
    }

    return "";
  }

  let html = `
    <table class="dik-table">
      <thead>
        <tr>
          <th>No.</th>
          <th>Kelompok Informasi</th>
          <th>Item Informasi</th>
          <th>Dasar Hukum Pengecualian Informasi</th>
          <th>Konsekuensi Jika Dibuka</th>
          <th>Konsekuensi Jika Ditutup</th>
          <th>Jangka Waktu</th>
        </tr>
      </thead>

      <tbody>
  `;

  pageRows.forEach(function (row, index) {

    const kelompokInformasi = getField(
      row,
      "KELOMPOK_INFORMASI",
      0
    );

    const itemInformasi = getField(
      row,
      "ITEM_INFORMASI",
      1
    );

    const dasarHukum = getField(
      row,
      "DASAR_HUKUM_PENGECUALIAN_INFORMASI",
      2
    );

    const konsekuensiDibuka = getField(
      row,
      "KONSEKUENSI_DIBUKA",
      3
    );

    const konsekuensiDitutup = getField(
      row,
      "KONSEKUENSI_DITUTUP",
      4
    );

    const jangkaWaktu = getField(
      row,
      "JANGKA_WAKTU",
      5
    );

    const nomor = start + index + 1;

    html += `
      <tr>

        <td>
          ${nomor}
        </td>

        <td>
          <div class="dik-cell-title">
            ${dikEscapeHtml(kelompokInformasi)}
          </div>
        </td>

        <td>
          ${dikEscapeHtml(itemInformasi)}
        </td>

        <td>
          ${dikEscapeHtml(dasarHukum)}
        </td>

        <td>
          ${dikEscapeHtml(konsekuensiDibuka)}
        </td>

        <td>
          ${dikEscapeHtml(konsekuensiDitutup)}
        </td>

        <td>
          ${dikEscapeHtml(jangkaWaktu)}
        </td>

      </tr>
    `;
  });

  html += `
      </tbody>
    </table>
  `;

  tableWrap.innerHTML = html;

  const total = dikFilteredData.length;

  document.getElementById("dikResultCount").textContent =
    total + " informasi";

  dikRenderPagination();
}
    function dikRenderPagination() {
      const totalPages = Math.max(
        1,
        Math.ceil(dikFilteredData.length / DIK_PER_PAGE)
      );

      const pageInfo = document.getElementById("dikPageInfo");
      const pageButtons = document.getElementById("dikPageButtons");

      if (!pageInfo || !pageButtons) return;

      if (!dikFilteredData.length) {
        pageInfo.textContent = "";
        pageButtons.innerHTML = "";
        return;
      }

      const start = (dikCurrentPage - 1) * DIK_PER_PAGE + 1;
      const end = Math.min(
        dikCurrentPage * DIK_PER_PAGE,
        dikFilteredData.length
      );

      pageInfo.textContent =
        "Menampilkan " +
        start +
        "–" +
        end +
        " dari " +
        dikFilteredData.length +
        " informasi";

      let html = `
        <button
          type="button"
          class="dik-page-btn"
          ${dikCurrentPage === 1 ? "disabled" : ""}
          onclick="dikGoToPage(${dikCurrentPage - 1})"
        >
          ‹
        </button>
      `;

      for (let page = 1; page <= totalPages; page++) {
        html += `
          <button
            type="button"
            class="dik-page-btn ${page === dikCurrentPage ? "active" : ""}"
            onclick="dikGoToPage(${page})"
          >
            ${page}
          </button>
        `;
      }

      html += `
        <button
          type="button"
          class="dik-page-btn"
          ${dikCurrentPage === totalPages ? "disabled" : ""}
          onclick="dikGoToPage(${dikCurrentPage + 1})"
        >
          ›
        </button>
      `;

      pageButtons.innerHTML = html;
    }

    function dikGoToPage(page) {
      const totalPages = Math.max(
        1,
        Math.ceil(dikFilteredData.length / DIK_PER_PAGE)
      );

      if (page < 1 || page > totalPages) return;

      dikCurrentPage = page;
      dikRenderTable();

      const tableWrap = document.querySelector(".dik-data-list");
      if (tableWrap) {
        tableWrap.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    }

    function dikApplySearch() {
      const input = document.getElementById("dikSearchInput");
      const keyword = dikNormalize(input ? input.value : "").toLowerCase();

      dikFilteredData = dikAllData.filter(function (row) {
        if (!keyword) return true;

        const values = dikGetValues(row);

        return values.some(function (value) {
          return dikNormalize(value)
            .toLowerCase()
            .includes(keyword);
        });
      });

      dikCurrentPage = 1;
      dikRenderTable();
    }

    async function loadDIK() {
      const loading = document.getElementById("dikLoading");

      try {
        dikHideError();

        const response = await fetch(
          DIK_API_URL + "?action=dik"
        );

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status + " saat mengambil data DIK."
          );
        }

        const result = await response.json();

        if (!result || result.success !== true) {
          throw new Error(
            result && result.message
              ? result.message
              : "API DIK mengembalikan success=false."
          );
        }

        if (!Array.isArray(result.data)) {
          throw new Error("Format data DIK tidak sesuai.");
        }

        dikAllData = result.data;
        dikFilteredData = dikAllData.slice();

        if (loading) loading.style.display = "none";

        dikRenderTable();

      } catch (error) {
        console.error("Gagal memuat DIK:", error);

        if (loading) loading.style.display = "none";

        dikShowError(
          "Data Informasi Dikecualikan belum dapat dimuat. " +
          error.message
        );

        document.getElementById("dikResultCount").textContent =
          "Gagal memuat data";

        document.getElementById("dikTableWrap").innerHTML = "";
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      const searchInput =
        document.getElementById("dikSearchInput");

      if (searchInput) {
        searchInput.addEventListener("input", dikApplySearch);
      }

      document.addEventListener("layout:loaded", function () {
        const kicker =
          document.getElementById("innerHeroKicker");

        const title =
          document.getElementById("innerHeroTitle");

        const description =
          document.getElementById("innerHeroDescription");

        if (kicker) {
          kicker.textContent = "INFORMASI DIKECUALIKAN";
        }

        if (title) {
          title.textContent = "Informasi Dikecualikan";
        }

        if (description) {
          description.textContent =
            "Daftar informasi yang dikecualikan dari keterbukaan informasi publik pada Kantor Wilayah Kementerian Agama Provinsi Banten.";
        }

        loadDIK();
      });
    });
  </script>

</body>
</html>
