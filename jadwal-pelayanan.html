<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Jadwal Pelayanan | PPID Kanwil Kementerian Agama Provinsi Banten</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="assets/css/accessibility.css">
</head>

<body>

  <!-- =========================
       MASTER NAVBAR
  ========================== -->
  <div id="siteNavbar"></div>


  <!-- =========================
       MASTER HERO
  ========================== -->
  <div id="innerHero"></div>


  <!-- =========================
       MAIN CONTENT
  ========================== -->
 <main class="page-content">

  <section class="content-section jadwal-section">

    <div class="jadwal-grid">

      <!-- SENIN - KAMIS -->
      <article class="jadwal-card">

        <div class="jadwal-card-header">
          <span class="jadwal-kicker">HARI PELAYANAN</span>
          <h3>Senin – Kamis</h3>
        </div>

        <div class="jadwal-time">

          <div class="jadwal-row">
            <span class="jadwal-label">
              Jam Pelayanan
            </span>

            <strong>
              08.00 – 15.00 WIB
            </strong>
          </div>

          <div class="jadwal-row">
            <span class="jadwal-label">
              Istirahat
            </span>

            <strong>
              12.00 – 13.00 WIB
            </strong>
          </div>

        </div>

      </article>


      <!-- JUMAT -->
      <article class="jadwal-card">

        <div class="jadwal-card-header">
          <span class="jadwal-kicker">HARI PELAYANAN</span>
          <h3>Jumat</h3>
        </div>

        <div class="jadwal-time">

          <div class="jadwal-row">
            <span class="jadwal-label">
              Jam Pelayanan
            </span>

            <strong>
              08.00 – 15.00 WIB
            </strong>
          </div>

          <div class="jadwal-row">
            <span class="jadwal-label">
              Istirahat
            </span>

            <strong>
              11.00 – 13.00 WIB
            </strong>
          </div>

        </div>

      </article>

    </div>


    <!-- KETERANGAN -->
    <div class="jadwal-note">
      <span class="jadwal-note-icon">i</span>

      <p>
        Jam pelayanan dapat menyesuaikan ketentuan dan kondisi pelayanan
        yang berlaku.
      </p>
    </div>

  </section>

</main>

  <!-- =========================
       MASTER FOOTER
  ========================== -->
  <div id="siteFooter"></div>


  <!-- =========================
       ACCESSIBILITY
  ========================== -->
  <div id="accessibility"></div>


  <!-- =========================
       MASTER LAYOUT
  ========================== -->
  <script src="layout.js"></script>


  <!-- =========================
       INNER HERO CONTENT
  ========================== -->
  <script>
    document.addEventListener("layout:loaded", function () {

      const kicker =
        document.getElementById("innerHeroKicker");

      const title =
        document.getElementById("innerHeroTitle");

      const description =
        document.getElementById("innerHeroDescription");


      if (kicker) {
        kicker.textContent =
          "LAYANAN INFORMASI PUBLIK";
      }


      if (title) {
        title.textContent =
          "Jadwal Pelayanan";
      }


      if (description) {
        description.textContent =
          "Informasi mengenai jadwal pelayanan informasi publik PPID Kanwil Kementerian Agama Provinsi Banten.";
      }

    });
  </script>


  <!-- =========================
       JADWAL PAGE STYLE
  ========================== -->
  <style>

    .jadwal-intro {
      max-width: 760px;
      margin-bottom: 28px;
    }

    .jadwal-intro p {
      margin: 0;

      font-size: 15px;
      line-height: 1.8;
    }


    .jadwal-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 22px;

    }


    .jadwal-card {
      position: relative;

      background: #ffffff;

      border: 1px solid #e3ebe7;

    }

    }


    .jadwal-kicker {

    }


    .jadwal-card h3 {
      margin: 0;

      font-size: 23px;
      line-height: 1.3;

      font-weight: 750;
    }


    .jadwal-time {
      display: grid;

      gap: 12px;
    }


    .jadwal-row {
      display: flex;

      align-items: center;

        font-size: 21px;

    }


    @media (max-width: 520px) {
