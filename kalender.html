<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kalender Kegiatan | PPID Kanwil Kemenag Banten</title>

  <link rel="stylesheet" href="style.css">

  <style>

    /* =====================================================
       KALENDER
    ===================================================== */

    .kalender-section {
      width: 100%;
      padding: 38px 42px 64px;
    }

    /* =====================================================
       TOOLBAR
    ===================================================== */

    .kalender-toolbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 160px 160px auto;
      gap: 12px;
      margin-bottom: 22px;
    }

    .kalender-search,
    .kalender-filter {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1px solid #dfe7e3;
      border-radius: 10px;
      background: #ffffff;
      color: #263a32;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: .2s ease;
    }

    .kalender-search:focus,
    .kalender-filter:focus {
      border-color: #0f5132;
      box-shadow: 0 0 0 3px rgba(15,81,50,.08);
    }

    .kalender-refresh {
      height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      background: #0f5132;
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .kalender-refresh:hover {
      background: #0a3f27;
    }

    /* =====================================================
       TABLE WRAPPER
    ===================================================== */

    .kalender-table-wrapper {
      width: 100%;
      overflow-x: auto;
      background: #ffffff;
      border: 1px solid #e2eae6;
      border-radius: 16px;
      box-shadow: 0 8px 26px rgba(27,66,49,.06);
    }

    .kalender-table {
      width: 100%;
      min-width: 1050px;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px;
    }

    /* =====================================================
       TABLE HEADER
    ===================================================== */

    .kalender-table thead th {
      padding: 15px 14px;
      background: #0f5132;
      color: #ffffff;
      text-align: left;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 750;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
      border-right: 1px solid rgba(255,255,255,.12);
    }

    .kalender-table thead th:first-child {
      border-top-left-radius: 15px;
      text-align: center;
      width: 58px;
    }

    .kalender-table thead th:last-child {
      border-right: 0;
      border-top-right-radius: 15px;
    }

    /* =====================================================
       TABLE BODY
    ===================================================== */

    .kalender-table tbody td {
      padding: 16px 14px;
      vertical-align: top;
      color: #45564f;
      line-height: 1.6;
      border-bottom: 1px solid #edf1ef;
      border-right: 1px solid #f0f3f2;
    }

    .kalender-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .kalender-table tbody td:last-child {
      border-right: 0;
    }

    .kalender-table tbody tr {
      transition: background .15s ease;
    }

    .kalender-table tbody tr:hover {
      background: #f8fbf9;
    }

    .kalender-no {
      width: 58px;
      text-align: center;
      color: #718078 !important;
      font-weight: 700;
    }

    .kalender-bulan {
      width: 105px;
      color: #0f5132 !important;
      font-weight: 750;
      white-space: nowrap;
    }

    .kalender-agenda {
      min-width: 250px;
      color: #173e2e !important;
      font-weight: 700;
    }

    .kalender-output {
      min-width: 230px;
    }

    .kalender-unit {
      min-width: 170px;
    }

    .kalender-asta {
      min-width: 190px;
    }

    /* =====================================================
       STATUS
    ===================================================== */

    .kalender-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eaf6ef;
      color: #0f5132;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 750;
      white-space: nowrap;
    }

    .kalender-status.status-lain {
      background: #f1f4f3;
      color: #63716b;
    }

    /* =====================================================
       LOADING / EMPTY / ERROR
    ===================================================== */

    .kalender-state {
      padding: 42px 24px;
      text-align: center;
      color: #718078;
      font-size: 14px;
    }

    .kalender-error {
      padding: 30px 24px;
      text-align: center;
      color: #a33a32;
      background: #fff8f7;
      border: 1px solid #f0d9d5;
      border-radius: 14px;
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 900px) {

      .kalender-section {
        padding-left: 28px;
        padding-right: 28px;
      }

      .kalender-toolbar {
        grid-template-columns: 1fr 160px;
      }

      .kalender-refresh {
        grid-column: 1 / -1;
      }

    }

    @media (max-width: 640px) {

      .kalender-section {
        padding: 28px 18px 48px;
      }

      .kalender-toolbar {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .kalender-refresh {
        grid-column: auto;
      }

      .kalender-table {
        min-width: 1000px;
      }

      .kalender-note {
  margin-top: 14px;
  padding: 12px 16px;
  border-left: 4px solid #0f5132;
  border-radius: 8px;
  background: #f5f9f7;
  color: #617069;
  font-size: 12px;
  line-height: 1.6;
}

.kalender-note strong {
  color: #0f5132;
}

    }

  </style>

</head>


<body
  data-hero-kicker="KALENDER KEGIATAN"
  data-hero-title="Kalender Kegiatan"
  data-hero-description="Informasi agenda kegiatan Kanwil Kementerian Agama Provinsi Banten yang disajikan secara terstruktur dan dapat ditelusuri berdasarkan tahun."
>


  <!-- =====================================================
       NAVBAR MASTER
  ====================================================== -->

  <div id="siteNavbar"></div>


  <!-- =====================================================
       INNER HERO MASTER
  ====================================================== -->

  <div id="innerHero"></div>


  <!-- =====================================================
       CONTENT
  ====================================================== -->

  <main class="page-content">

    <section class="content-section kalender-section">


      <!-- =================================================
           TOOLBAR
      ================================================== -->

     <div class="kalender-toolbar">
  <input
    type="text"
    id="searchInput"
    class="kalender-search"
    placeholder="Cari agenda kegiatan..."
  >

  <select id="tahunFilter" class="kalender-filter">
    <option value="">Semua Tahun</option>
  </select>

  <select id="bulanFilter" class="kalender-filter">
    <option value="">Semua Bulan</option>
  </select>

  <button id="refreshButton" class="kalender-refresh" type="button">
    ↻ Refresh
  </button>
</div>


      <!-- =================================================
           TABLE
      ================================================== -->

      <div id="content">

        <div class="kalender-table-wrapper">

          <div class="kalender-state">
            Memuat kalender kegiatan...
          </div>

        </div>

      </div>


    </section>

  </main>


  <!-- =====================================================
       FOOTER MASTER
  ====================================================== -->

  <div id="siteFooter"></div>


  <!-- =====================================================
       ACCESSIBILITY MASTER
  ====================================================== -->

  <div id="accessibility"></div>


  <!-- =====================================================
       LAYOUT
  ====================================================== -->

  <script src="layout.js"></script>


  <script>

    /* =====================================================
       API
    ===================================================== */

    const API_URL =
      'https://script.google.com/macros/s/AKfycby74M5l9jbsxZOHMq9_svivqRHK9xbK-Ms-iNfSmiggTlUjdnmQbfMC2OeuRVs3M2zT/exec';


    let allData = [];


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return '';
      }

      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }


    /* =====================================================
       STATUS CLASS
    ===================================================== */

    function getStatusClass(status) {

      const text =
        String(status || '')
          .toLowerCase()
          .trim();

      if (text === 'published') {
        return '';
      }

      return 'status-lain';

    }


    /* =====================================================
       LOAD DATA
    ===================================================== */

    async function loadKalender() {

      const content =
        document.getElementById('content');

      content.innerHTML = `
        <div class="kalender-table-wrapper">
          <div class="kalender-state">
            Memuat kalender kegiatan...
          </div>
        </div>
      `;


      try {

        const response =
          await fetch(
            API_URL + '?action=kalender'
          );


        if (!response.ok) {

          throw new Error(
            'HTTP Error ' +
            response.status
          );

        }


        const result =
          await response.json();


        console.log(
          'API Kalender:',
          result
        );


        if (result.success !== true) {

          throw new Error(
            result.message ||
            'API mengembalikan success=false'
          );

        }


        allData =
          Array.isArray(result.data)
            ? result.data
            : [];


        buildYearFilter();
buildMonthFilter();
        applyFilter();


      } catch (error) {

        console.error(
          'Gagal memuat kalender:',
          error
        );


        content.innerHTML = `

          <div class="kalender-error">

            <strong>
              Data kalender gagal dimuat.
            </strong>

            <br><br>

            ${escapeHTML(error.message)}

          </div>

        `;

      }

    }


    /* =====================================================
       YEAR FILTER
    ===================================================== */

    function buildYearFilter() {

      const select =
        document.getElementById(
          'tahunFilter'
        );


      const years =
        [
          ...new Set(
            allData
              .map(item =>
                String(item.tahun || '').trim()
              )
              .filter(Boolean)
          )
        ]
        .sort(
          (a, b) =>
            Number(b) - Number(a)
        );


      select.innerHTML = `
        <option value="">
          Semua Tahun
        </option>
      `;


      years.forEach(function(year) {

        const option =
          document.createElement('option');

        option.value = year;

        option.textContent =
          year;

        select.appendChild(option);

      });

    }
function buildMonthFilter() {
  const monthFilter = document.getElementById("bulanFilter");

  if (!monthFilter) return;

  const months = [
    "Januari",
    "Februari",
    "Maret",
    "April",
    "Mei",
    "Juni",
    "Juli",
    "Agustus",
    "September",
    "Oktober",
    "November",
    "Desember"
  ];

  const existingMonths = [
    ...new Set(
      allData
        .map(item => String(item.bulan || "").trim())
        .filter(Boolean)
    )
  ];

  monthFilter.innerHTML = `
    <option value="">Semua Bulan</option>
    ${months
      .filter(month =>
        existingMonths.some(
          value => value.toLowerCase() === month.toLowerCase()
        )
      )
      .map(month => `<option value="${escapeHTML(month)}">${escapeHTML(month)}</option>`)
      .join("")}
  `;
}

    /* =====================================================
       RENDER TABLE
    ===================================================== */

    function renderData(data) {

      const content =
        document.getElementById('content');


      if (
        !data ||
        data.length === 0
      ) {

        content.innerHTML = `

          <div class="kalender-table-wrapper">

            <div class="kalender-state">
              Belum terdapat agenda kegiatan
              yang sesuai dengan pencarian.
            </div>

          </div>

        `;

        return;

      }


      let rowsHTML = '';


      data.forEach(function(item, index) {

        const bulan =
          escapeHTML(
            item.bulan || '-'
          );

        const agenda =
          escapeHTML(
            item.agenda || '-'
          );

        const outputTarget =
          escapeHTML(
            item.output_target || '-'
          );

        const unitKerja =
          escapeHTML(
            item.unit_kerja || '-'
          );

        const astaProtas =
          escapeHTML(
            item.asta_protas || '-'
          );

        const status =
          escapeHTML(
            item.status || '-'
          );

        const statusClass =
          getStatusClass(
            item.status
          );


        rowsHTML += `

          <tr>

            <td class="kalender-no">
              ${index + 1}
            </td>

            <td class="kalender-bulan">
              ${bulan}
            </td>

            <td class="kalender-agenda">
              ${agenda}
            </td>

            <td class="kalender-output">
              ${outputTarget}
            </td>

            <td class="kalender-unit">
              ${unitKerja}
            </td>

            <td class="kalender-asta">
              ${astaProtas}
            </td>

            <td>

              <span class="kalender-status ${statusClass}">
                ${status}
              </span>

            </td>

          </tr>

        `;

      });


     content.innerHTML = `

  <div class="kalender-table-wrapper">

    <table class="kalender-table">

      <thead>

        <tr>

          <th>No</th>
          <th>Bulan</th>
          <th>Agenda Kegiatan</th>
          <th>Output / Target</th>
          <th>Unit Kerja</th>
          <th>Asta Protas</th>
          <th>Status</th>

        </tr>

      </thead>

      <tbody>

        ${rowsHTML}

      </tbody>

    </table>

  </div>

  <div class="kalender-note">
    <strong>Catatan:</strong>
    Jadwal kegiatan dapat berubah sewaktu-waktu sesuai dengan kebutuhan,
    kebijakan, dan kondisi pelaksanaan kegiatan.
  </div>

`;

    }


    /* =====================================================
       FILTER
    ===================================================== */

    function applyFilter() {

      const keyword =
        document
          .getElementById('searchInput')
          .value
          .toLowerCase()
          .trim();


      const year =
        document
          .getElementById('tahunFilter')
          .value
          .trim();
const month = document.getElementById("bulanFilter").value;

      const filtered =
        allData.filter(function(item) {

          const searchableText =
            [

              item.id,
              item.tahun,
              item.bulan,
              item.agenda,
              item.output_target,
              item.unit_kerja,
              item.asta_protas,
              item.status

            ]
            .join(' ')
            .toLowerCase();


          const matchesKeyword =
            !keyword ||
            searchableText.includes(
              keyword
            );


          const matchesYear =
            !year ||
            String(item.tahun || '')
              .trim() === year;
const matchMonth =
    !month ||
    String(item.bulan || "").toLowerCase() ===
      month.toLowerCase();

          return (
            matchesKeyword &&
            matchesYear && matchMonth
          );

        });


      renderData(filtered);

    }


    /* =====================================================
       EVENTS
    ===================================================== */

    document
      .getElementById('searchInput')
      .addEventListener(
        'input',
        applyFilter
      );


    document
      .getElementById('tahunFilter')
      .addEventListener(
        'change',
        applyFilter
      );

document
  .getElementById("bulanFilter")
  .addEventListener("change", applyFilter);

    
    document
      .getElementById('refreshButton')
      .addEventListener(
        'click',
        loadKalender
      );


    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    loadKalender();

  </script>


</body>

</html>
