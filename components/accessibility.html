<!-- AKSESIBILITAS -->
<div class="aksesibilitas">

  <button
    type="button"
    class="aksesibilitas-toggle"
    id="aksesibilitasToggle"
    aria-label="Buka menu aksesibilitas"
    aria-expanded="false"
  >
    <span class="aksesibilitas-icon">♿</span>
  </button>


  <div
    class="aksesibilitas-panel"
    id="aksesibilitasPanel"
    aria-hidden="true"
  >

    <div class="aksesibilitas-header">

      <div>
        <span class="aksesibilitas-kicker">
          AKSESIBILITAS
        </span>

        <strong>
          Akses Disabilitas
        </strong>
      </div>


      <button
        type="button"
        class="aksesibilitas-close"
        id="aksesibilitasClose"
        aria-label="Tutup menu aksesibilitas"
      >
        ×
      </button>

    </div>


    <div class="aksesibilitas-options">

      <button
        type="button"
        data-accessibility="font-plus"
      >
        <span>+</span>
        Perbesar teks
      </button>


      <button
        type="button"
        data-accessibility="font-minus"
      >
        <span>−</span>
        Perkecil teks
      </button>


      <button
        type="button"
        data-accessibility="contrast"
      >
        <span>◐</span>
        Kontras tinggi
      </button>


      <button
        type="button"
        data-accessibility="motion"
      >
        <span>◌</span>
        Kurangi animasi
      </button>


      <button
        type="button"
        data-accessibility="reset"
      >
        <span>↺</span>
        Reset tampilan
      </button>

    </div>

  </div>

</div>
