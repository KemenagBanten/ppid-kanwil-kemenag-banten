<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Laporan - PPID Kanwil Kementerian Agama Provinsi Banten</title>

  <link rel="stylesheet" href="style.css?v=999">

  <style>
    /* =========================================================
       LAPORAN
       Mengikuti pola tampilan REGULASI
       ========================================================= */

    .laporan-page {
      padding: 60px 0 80px;
    }

    /* =========================
       TOOLBAR
       ========================= */

    .laporan-toolbar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .laporan-search-wrapper {
      position: relative;
      width: 100%;
    }

    .laporan-search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #7a8781;
      pointer-events: none;
    }

    #laporanSearchInput {
      width: 100%;
      height: 44px;
      padding: 0 16px 0 44px;
      box-sizing: border-box;
      border: 1px solid #dfe7e2;
      border-radius: 9px;
      background: #ffffff;
      color: #34433b;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    #laporanSearchInput:focus {
      border-color: #0f5132;
      box-shadow: 0 0 0 3px rgba(15, 81, 50, 0.08);
    }

    /* =========================
       FILTER
       ========================= */

    .laporan-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .laporan-filter-btn {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid #dfe7e2;
      background: #ffffff;
      color: #53615a;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      padding: 9px 15px;
      min-height: 38px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .laporan-filter-btn:hover {
      background: #f4f8f5;
      border-color: #cbdad1;
      color: #0f5132;
    }

    .laporan-filter-btn.active {
      background: #0f5132;
      border-color: #0f5132;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(15, 81, 50, 0.12);
    }

    /* =========================
       SORT
       ========================= */

    .laporan-sort {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0;
    }

    .laporan-sort label {
      color: #66736c;
      font-size: 13px;
      font-weight: 600;
    }

    #laporanSort {
      height: 38px;
      padding: 0 12px;
      border: 1px solid #dfe7e2;
      border-radius: 8px;
      background: #ffffff;
      color: #53615a;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    #laporanSort:focus {
      border-color: #0f5132;
      box-shadow: 0 0 0 3px rgba(15, 81, 50, 0.08);
    }

    /* =========================
       RESULT HEADER
       ========================= */

    .laporan-result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-top: 36px;
      margin-bottom: 12px;
    }

    .laporan-result-header h3 {
      margin: 0;
      font-size: 18px;
      color: #263a30;
    }

    #laporanResultCount {
      color: #718078;
      font-size: 12px;
    }

    /* =========================
       TABLE
       ========================= */

    .laporan-data-list {
  width: 100%;
  background: #ffffff;
  border: 1px solid #e2e9e5;
  border-radius: 15px;
  overflow-x: auto;
  overflow-y: hidden;
  box-shadow: 0 6px 24px rgba(26, 54, 41, 0.045);
}

.laporan-table {
  width: 100%;
  min-width: 900px;
  border-collapse: collapse;
  font-size: 13px;
}

.laporan-table th {
  background: #f4f8f5;
  color: #40544b;
  font-weight: 700;
  text-align: center;
  padding: 14px 16px;
  border-bottom: 1px solid #dfe7e2;
  white-space: nowrap;
}

.laporan-table td {
  padding: 15px 16px;
  color: #53615a;
  border-bottom: 1px solid #edf1ee;
  vertical-align: middle;
  line-height: 1.6;
}

.laporan-table tbody tr:last-child td {
  border-bottom: none;
}

.laporan-table tbody tr:hover {
  background: #fafcfb;
}

/* No. */
.laporan-table th:first-child,
.laporan-table td:first-child {
  width: 6%;
  text-align: center;
}

/* Judul Laporan */
.laporan-table th:nth-child(2) {
  width: 42%;
  text-align: center;
}

.laporan-table td:nth-child(2) {
  text-align: left;
}

/* Kategori */
.laporan-table th:nth-child(3) {
  width: 22%;
  text-align: center;
}

.laporan-table td:nth-child(3) {
  text-align: left;
}

/* Tahun */
.laporan-table th:nth-child(4) {
  width: 10%;
  text-align: center;
}

.laporan-table td:nth-child(4) {
  text-align: center;
  white-space: nowrap;
}

/* Dokumen */
.laporan-table th:nth-child(5) {
  width: 20%;
  text-align: center;
}

.laporan-table td:nth-child(5) {
  text-align: center;
}
    /* =========================
       JUDUL LAPORAN
       ========================= */

    .laporan-title {
      color: #263a30;
      font-weight: 650;
      line-height: 1.55;
    }

    /* =========================
       KATEGORI
       ========================= */

    .laporan-category {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 7px;
      background: #f1f6f3;
      color: #536b5e;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.3;
    }

    /* =========================
       TAHUN
       ========================= */

    .laporan-year {
      color: #53615a;
      font-weight: 650;
    }

    /* =========================
       BUTTON DOKUMEN
       ========================= */

    .laporan-document-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 8px 13px;
      border: 1px solid #0f5132;
      border-radius: 8px;
      background: #0f5132;
      color: #ffffff;
      text-decoration: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 650;
      line-height: 1.2;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
      white-space: nowrap;
    }

    .laporan-document-btn:hover {
      background: #0b4228;
      border-color: #0b4228;
      transform: translateY(-1px);
    }

    .laporan-no-document {
      color: #8a958f;
      font-size: 12px;
    }

    /* =========================
       EMPTY / LOADING
       ========================= */

    .laporan-empty {
      padding: 45px 20px;
      text-align: center;
      color: #747f78;
      font-size: 13px;
      line-height: 1.6;
    }

    .laporan-loading {
      padding: 45px 20px;
      text-align: center;
      color: #718078;
      font-size: 13px;
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 700px) {

      .laporan-page {
        padding: 45px 0 60px;
      }

      .laporan-result-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

      .laporan-sort {
        align-items: flex-start;
        flex-direction: column;
      }

      #laporanSort {
        width: 100%;
      }

      .laporan-table {
        min-width: 850px;
      }

    }
  </style>
</head>

<body>

  <!-- =======================================================
       NAVBAR
       ======================================================= -->

  <div id="siteNavbar"></div>

  <!-- =======================================================
       INNER HERO
       ======================================================= -->

  <div id="innerHero"></div>

  <!-- =======================================================
       CONTENT
       ======================================================= -->

  <main class="laporan-page">

    <div class="container">

      <!-- SEARCH + FILTER -->

      <section class="laporan-toolbar">

        <div class="laporan-search-wrapper">

          <span class="laporan-search-icon">
            ⌕
          </span>

          <input
            type="text"
            id="laporanSearchInput"
            placeholder="Cari judul laporan..."
            autocomplete="off"
          >

        </div>

        <div
          class="laporan-filters"
          id="laporanFilters"
        >

          <button
            type="button"
            class="laporan-filter-btn active"
            data-category=""
          >
            Semua
          </button>

          <button
            type="button"
            class="laporan-filter-btn"
            data-category="Laporan Tahunan PPID"
          >
            Laporan Tahunan PPID
          </button>

          <button
            type="button"
            class="laporan-filter-btn"
            data-category="Laporan Kinerja"
          >
            Laporan Kinerja
          </button>

          <button
            type="button"
            class="laporan-filter-btn"
            data-category="Laporan Keuangan"
          >
            Laporan Keuangan
          </button>

          <button
            type="button"
            class="laporan-filter-btn"
            data-category="Laporan BMN"
          >
            Laporan BMN
          </button>

          <button
            type="button"
            class="laporan-filter-btn"
            data-category="LHKPN Kakanwil"
          >
            LHKPN Kakanwil
          </button>

          <button
            type="button"
            class="laporan-filter-btn"
            data-category="Statistik Kanwil"
          >
            Statistik Kanwil
          </button>

        </div>

      </section>

      <!-- SORT -->

      <div class="laporan-sort">

        <label for="laporanSort">
          Urutkan:
        </label>

        <select id="laporanSort">

          <option value="terbaru">
            Terbaru → Terlama
          </option>

          <option value="terlama">
            Terlama → Terbaru
          </option>

        </select>

      </div>

      <!-- RESULT HEADER -->

      <div class="laporan-result-header">

        <h3>
          Daftar Laporan
        </h3>

        <span id="laporanResultCount">
          Memuat data...
        </span>

      </div>

      <!-- TABLE -->

      <div class="laporan-data-list">

        <div
          id="laporanTableWrapper"
          class="laporan-loading"
        >
          Memuat data laporan...
        </div>

      </div>

    </div>

  </main>

  <!-- =======================================================
       FOOTER
       ======================================================= -->

  <div id="siteFooter"></div>

  <!-- ACCESSIBILITY -->

  <div id="accessibility"></div>

  <!-- =======================================================
       LAYOUT
       ======================================================= -->

  <script src="layout.js"></script>

  <!-- =======================================================
       LAPORAN SCRIPT
       ======================================================= -->

  <script>

    const LAPORAN_API_URL =
      'https://script.google.com/macros/s/AKfycby74M5l9jbsxZOHMq9_svivqRHK9xbK-Ms-iNfSmiggTlUjdnmQbfMC2OeuRVs3M2zT/exec';


    let laporanData = [];

    let laporanActiveCategory = '';


    /* =======================================================
       LOAD DATA
       ======================================================= */

    async function loadLaporanData() {

      const wrapper =
        document.getElementById(
          'laporanTableWrapper'
        );

      const resultCount =
        document.getElementById(
          'laporanResultCount'
        );

      try {

        wrapper.innerHTML =
          '<div class="laporan-loading">Memuat data laporan...</div>';

        resultCount.textContent =
          'Memuat data...';


        const response =
          await fetch(
            LAPORAN_API_URL +
            '?action=laporan'
          );


        if (!response.ok) {

          throw new Error(
            'HTTP Error ' +
            response.status
          );

        }


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.message ||
            'API laporan mengembalikan success=false'
          );

        }


        laporanData =
          Array.isArray(result.data)
            ? result.data
            : [];


        renderLaporan();

      } catch (error) {

        console.error(
          'ERROR LOAD LAPORAN:',
          error
        );


        resultCount.textContent =
          'Gagal memuat data';


        wrapper.innerHTML = `

          <div class="laporan-empty">

            <strong>
              Data laporan tidak dapat dimuat.
            </strong>

            <br><br>

            ${escapeHTML(
              error.message
            )}

          </div>

        `;

      }

    }


    /* =======================================================
       RENDER
       ======================================================= */

    function renderLaporan() {

      const wrapper =
        document.getElementById(
          'laporanTableWrapper'
        );

      const resultCount =
        document.getElementById(
          'laporanResultCount'
        );

      const searchInput =
        document.getElementById(
          'laporanSearchInput'
        );

      const sortSelect =
        document.getElementById(
          'laporanSort'
        );


      const search =
        searchInput
          ? searchInput.value
              .toLowerCase()
              .trim()
          : '';


      const sort =
        sortSelect
          ? sortSelect.value
          : 'terbaru';


      /* =========================
         FILTER
         ========================= */

      let filtered =
        laporanData.filter(
          function(item) {

            const judul =
              String(
                item.judul_laporan ||
                ''
              );

            const kategori =
              String(
                item.kategori ||
                ''
              );

            const tahun =
              String(
                item.tahun ||
                ''
              );


            const searchText =
              (
                judul +
                ' ' +
                kategori +
                ' ' +
                tahun
              )
                .toLowerCase();


            const matchSearch =
              !search ||
              searchText.includes(
                search
              );


            const matchCategory =
              !laporanActiveCategory ||
              kategori ===
                laporanActiveCategory;


            return (
              matchSearch &&
              matchCategory
            );

          }
        );


      /* =========================
         SORT
         ========================= */

      filtered.sort(
        function(a, b) {

          const tahunA =
            Number(
              a.tahun || 0
            );

          const tahunB =
            Number(
              b.tahun || 0
            );


          if (
            sort === 'terlama'
          ) {

            return tahunA - tahunB;

          }


          return tahunB - tahunA;

        }
      );


      /* =========================
         RESULT COUNT
         ========================= */

      resultCount.textContent =
        filtered.length +
        ' laporan ditemukan';


      /* =========================
         EMPTY
         ========================= */

      if (!filtered.length) {

        wrapper.innerHTML = `

          <div class="laporan-empty">

            Tidak ada laporan yang sesuai
            dengan pencarian atau filter.

          </div>

        `;

        return;

      }


      /* =========================
         TABLE
         ========================= */

      wrapper.innerHTML = `

        <table class="laporan-table">

          <thead>

            <tr>

              <th>No.</th>

              <th>Judul Laporan</th>

              <th>Kategori</th>

              <th>Tahun</th>

              <th>Dokumen</th>

            </tr>

          </thead>

          <tbody>

            ${
              filtered
                .map(
                  function(item, index) {

                    const judul =
                      item.judul_laporan ||
                      'Tanpa Judul';


                    const kategori =
                      item.kategori ||
                      '-';


                    const tahun =
                      item.tahun ||
                      '-';


                    const documentUrl =
                      item.url_dokumen
                        ? String(
                            item.url_dokumen
                          ).trim()
                        : '';


                    return `

                      <tr>

                        <td>
                          ${index + 1}
                        </td>

                        <td>

                          <div class="laporan-title">

                            ${escapeHTML(
                              judul
                            )}

                          </div>

                        </td>

                        <td>

                          <span class="laporan-category">

                            ${escapeHTML(
                              kategori
                            )}

                          </span>

                        </td>

                        <td>

                          <span class="laporan-year">

                            ${escapeHTML(
                              tahun
                            )}

                          </span>

                        </td>

                        <td>

                          ${
                            documentUrl

                              ? `

                                <a
                                  class="laporan-document-btn"
                                  href="${escapeAttribute(
                                    documentUrl
                                  )}"
                                  target="_blank"
                                  rel="noopener noreferrer"
                                >
                                  Lihat Dokumen
                                </a>

                              `

                              : `

                                <span class="laporan-no-document">
                                  Dokumen belum tersedia
                                </span>

                              `
                          }

                        </td>

                      </tr>

                    `;

                  }
                )
                .join('')
            }

          </tbody>

        </table>

      `;

    }


    /* =======================================================
       SEARCH
       ======================================================= */

    const laporanSearchInput =
      document.getElementById(
        'laporanSearchInput'
      );


    if (laporanSearchInput) {

      laporanSearchInput.addEventListener(
        'input',
        renderLaporan
      );

    }


    /* =======================================================
       FILTER CATEGORY
       ======================================================= */

    const laporanFilterButtons =
      document.querySelectorAll(
        '.laporan-filter-btn'
      );


    laporanFilterButtons.forEach(
      function(button) {

        button.addEventListener(
          'click',
          function() {

            laporanFilterButtons.forEach(
              function(btn) {

                btn.classList.remove(
                  'active'
                );

              }
            );


            this.classList.add(
              'active'
            );


            laporanActiveCategory =
              this.dataset.category ||
              '';


            renderLaporan();

          }
        );

      }
    );


    /* =======================================================
       SORT
       ======================================================= */

    const laporanSort =
      document.getElementById(
        'laporanSort'
      );


    if (laporanSort) {

      laporanSort.addEventListener(
        'change',
        renderLaporan
      );

    }


    /* =======================================================
       ESCAPE HTML
       ======================================================= */

    function escapeHTML(value) {

      return String(
        value ?? ''
      )

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    function escapeAttribute(value) {

      return escapeHTML(
        value
      );

    }


    /* =======================================================
       INNER HERO
       ======================================================= */

    document.addEventListener(
  'layout:loaded',
  function() {

    const kicker =
      document.getElementById(
        'innerHeroKicker'
      );

    const title =
      document.getElementById(
        'innerHeroTitle'
      );

    const description =
      document.getElementById(
        'innerHeroDescription'
      );

    if (kicker) {
      kicker.textContent = 'LAPORAN';
    }

    if (title) {
      title.textContent = 'Laporan';
    }

    if (description) {
      description.textContent =
        'Kumpulan laporan terkait pelaksanaan keterbukaan informasi publik di lingkungan Kantor Wilayah Kementerian Agama Provinsi Banten.';
    }

  }
);

    /* =======================================================
       START
       ======================================================= */

    loadLaporanData();

  </script>

</body>
</html>
